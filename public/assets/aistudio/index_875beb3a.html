    /**
     * fetchAuthoritativeState() -> Promise<object>
     *   Contract (input): takes no arguments; requires a same-origin serving context so the
     *     operator session cookie is eligible to be sent.
     *   Contract (output, success): resolves with the parsed JSON body of any 2xx response from
     *     GET /agent/state (shape is server-defined; treated as opaque read-only display data).
     *   Contract (output, error): rejects with Error for every failure mode:
     *       * HTTP 401/403/4xx/5xx -> Error(`authoritative state unavailable: ${status}`)
     *       * network failure / invalid JSON -> the underlying fetch() or json() Error
     *     The caller treats rejection as "unavailable" and falls back to local state.
     *   Pre-condition: none beyond the same-origin serving context.
     *   Post-condition: no localStorage key is read or written; no grade state is created,
     *     overwritten, or re-based client-side; only the six existing sa_* keys may ever be
     *     written (by the existing safeSet effects in App).
     *   Invariant: read-only and idempotent; never mutates client state; never stores
     *     server-derived grades in localStorage.
     *   Side effect: performs exactly one network GET to /agent/state with
     *     credentials: 'same-origin' (session cookie sent for same-origin responses only).
     *   Testability: named module-level function; drive it directly in tests with a fetch mock
     *     (resolve 200 JSON, resolve non-ok Response, or reject).
     */
    async function fetchAuthoritativeState() {
      // MECHANICAL: credentials: 'same-origin' attaches the operator session cookie only to
      // same-origin responses; any cross-origin redirect drops the cookie (intended).
      const res = await fetch('/agent/state', { credentials: 'same-origin' });
      if (!res.ok) throw new Error(`authoritative state unavailable: ${res.status}`);
      return await res.json();
    }

    // --- OPERATOR SERVER FETCHES (settings tab + dashboard badge) ---
    // Every request uses credentials: 'same-origin' so the HttpOnly sid cookie
    // travels to same-origin endpoints only; this client never reads sid.

    /**
     * ApiError -> Error
     *   input: message - string; status - HTTP status number (0 = network /
     *     parse failure sentinel).
     *   output: an Error instance carrying .status and .name = 'ApiError';
     *     callers match on err.status for 401 / 403 / 404 / 409 / 429 / 503.
     *   Pre-condition: none. Post-condition: pure value object; no side effects.
     *   Invariant: status is always a number.
     *   Side effect: none.
     */
    class ApiError extends Error {
      constructor(message, status) {
        super(message);
        this.name = 'ApiError';
        this.status = status;
      }
    }

    /**
     * fetchJson(path, init) -> Promise<object | null>
     *   input: path - same-origin URL string; init - optional { method?, body? }
     *     where body is a JS object serialized as JSON (only for non-GET
     *     methods; fetch() rejects bodies on GET/HEAD).
     *   output success: parsed JSON body of any 2xx response (may be null for
     *     empty 2xx bodies). output error: rejects with ApiError(message,
     *     status); status is the HTTP status (401, 403, 404, 409, 429, 503,
     *     ...) or 0 for network failure / invalid JSON.
     *   Pre-condition: same-origin serving context so the session cookie is
     *     eligible to be sent. Post-condition: no localStorage key read or
     *     written; the HttpOnly session cookie is never read by JS; client
     *     state is never created, overwritten, or re-based from this call.
     *   Invariant: exactly one network fetch per call; credentials:
     *     'same-origin' (the cookie is dropped on any cross-origin redirect).
     *   Side effect: one network request; on success returns server data for
     *     read-only display only.
     */
    async function fetchJson(path, init = {}) {
      const opts = { credentials: 'same-origin', ...init };
      if (init.body && opts.method !== 'GET' && opts.method !== 'HEAD') {
        // MECHANICAL: fetch() throws when a body is attached to GET/HEAD, so
        // bodies are stringified and attached only for mutating methods.
        opts.headers = { 'Content-Type': 'application/json', ...(init.headers || {}) };
        opts.body = JSON.stringify(init.body);
      }
      let data = null;
      try {
        const res = await fetch(path, opts);
        try { data = await res.json(); } catch { data = null; }
        if (!res.ok) throw new ApiError(`server responded ${res.status}`, res.status);
        return data;
      } catch (err) {
        if (err instanceof ApiError) throw err;
        // MECHANICAL: network failure or unparsable body -> status 0 sentinel;
        // the caller renders a visible message and keeps the tab usable.
        throw new ApiError(String(err && err.message ? err.message : err), 0);
      }
    }

     *   Invariant: AWS and Azure never share a pill colour, so provider separation is visually

    function providerBadgeClass(provider) {

      // --- OPERATOR SIGN-IN (settings: Data & Backup) ---
      // handleSignIn() -> Promise<void>
      //   input: none (reads closed-over signInPassword). POSTs
      //     { operator_id: 'operator', password: string } to /auth/login with
      //     credentials: 'same-origin'.
      //   output success (200): session cookie sid set by the browser
      //     (HttpOnly; never read by JS); operatorSignedIn := true; pending
      //     proposals and migration preview (re)loaded.
      //   output 401 INVALID_CREDENTIALS: visible 'Invalid credentials'
      //     message; output 429 RATE_LIMITED: visible rate-limit message;
      //     output network/other: visible generic message. The tab stays fully
      //     usable in every case; localStorage is never touched.
      //   Pre-condition: signInPassword may be empty (server returns 400,
      //     rendered as a generic unavailable message). Post-condition: no
      //     new localStorage key; sid never read by client JS.
      //   Side effect: one POST /auth/login; the browser handles Set-Cookie sid.
      async function handleSignIn() {
        setSigningIn(true);
        setSignInError(null);
        try {
          await fetchJson('/auth/login', {
            method: 'POST',
            body: { operator_id: 'operator', password: signInPassword }
          });
          // MECHANICAL: sid is HttpOnly — the browser stores it; the client
          // never reads it. Signed-in status is confirmed by /agent/proposals.
          setOperatorSignedIn(true);
          await loadPendingProposals();
          // MECHANICAL: the initial unauthenticated mount fetch may have failed
          // with 401. After sign-in, fetch authoritative state so the branch
          // selector and assessment tab reflect D1 immediately.
          await refreshAuthoritativeState();
          // loadMigrationPreview() is triggered by the operatorSignedIn
          // effect above — no redundant fetch needed here.
        } catch (err) {
          if (err.status === 401) setSignInError('Invalid credentials. Please try again.');
          else if (err.status === 429) setSignInError('Too many sign-in attempts. Please wait a moment, then try again.');
          else setSignInError('Sign-in is unavailable right now. Try again later.');
        } finally {
          setSigningIn(false);
        }
      }

      function handleSignOut() {
        setOperatorSignedIn(false);
        setPendingProposals([]);
        setProposalsError(null);
        setDashboardPendingCount(null);
        setMigrationPreview(null);
        setMigrationError(null);
        setMigrationResult(null);
        // MECHANICAL: no /auth/logout route exists and sid is HttpOnly, so the
        // client cannot clear the server session. Signing out forgets the
        // session on the client only; the cookie expires on its own (24h TTL).
      }

      // loadPendingProposals() -> Promise<void>
      //   input: none. Fetches GET /agent/proposals with credentials:
      //     'same-origin'.
      //   output success (200): pendingProposals := data.proposals;
      //     dashboardPendingCount := proposals.length; operatorSignedIn :=
      //     true (a 200 confirms a live session). output 401: signed out,
      //     empty list, null dashboard count, no error (expected before sign
      //     in). output 403 / 503 / network / other: visible non-alarming
      //     error, list and count unchanged, tab fully usable.
      //   Pre-condition: none. Post-condition: no localStorage write; never
      //     silently swallows a failure — every path sets visible state.
      //   Side effect: one read-only GET /agent/proposals; the dashboard
      //     count is derived from the same payload the settings section shows.
      async function loadPendingProposals() {
        try {
          const data = await fetchJson('/agent/proposals');
          const proposals = Array.isArray(data && data.proposals) ? data.proposals : [];
          setPendingProposals(proposals);
          setProposalsError(null);
          setDashboardPendingCount(proposals.length);
          setOperatorSignedIn(true);
        } catch (err) {
          if (err.status === 401) {
            setOperatorSignedIn(false);
            setPendingProposals([]);
            setDashboardPendingCount(null);
            setProposalsError(null);
          } else {
            setDashboardPendingCount(null);
            setProposalsError('Unable to load pending proposals right now. Try again later.');
          }
        }
      }

      // handleDecide(proposalId, decision) -> Promise<void>
      //   input: proposalId - non-empty string; decision - the exact literal
      //     'APPROVE' | 'REJECT' expected by POST /review/decide. POSTs
      //     { proposal_id, decision } to /review/decide with credentials:
      //     'same-origin'.
      //   output success (200): proposal list refreshed (applied or rejected
      //     reflected server-side), error cleared. output 409
      //     PROPOSAL_TERMINAL: visible 'already decided' message AND list
      //     refreshed — never silent. output 401: signed out + visible
      //     message; 403 CSRF_REJECTED / 404 PROPOSAL_NOT_FOUND / 503 /
      //     network: visible message; list refreshed where state may have
      //     changed.
      //   Pre-condition: operator signed in. Post-condition: no localStorage
      //     write; every error path is visible, never silent.
      //   Side effect: one POST /review/decide (state-changing, CSRF-checked
      //     by middleware); followed by one GET /agent/proposals refresh.
      async function handleDecide(proposalId, decision) {
        setDecidingProposal(proposalId);
        // Decision phase: a state-changing POST. Its outcome is reported as the
        // decision outcome only — never as a refresh outcome. A decision that
        // commits must never be rendered as failed because a follow-up read
        // failed (Defect B).
        try {
          await fetchJson('/review/decide', {
            method: 'POST',
            body: { proposal_id: proposalId, decision }
          });
        } catch (err) {
          if (err.status === 401) {
            setOperatorSignedIn(false);
            setProposalsError('Sign-in expired. Please sign in again.');
          } else if (err.status === 403) {
            setProposalsError('Decision was rejected by the server.');
          } else if (err.status === 409) {
            setProposalsError('This proposal was already decided.');
            await loadPendingProposals();
          } else if (err.status === 404) {
            setProposalsError('Proposal not found.');
            await loadPendingProposals();
          } else {
            setProposalsError('Unable to apply the decision right now. Try again later.');
          }
          setDecidingProposal(null);
          return;
        }

        // Decision committed successfully. Refresh the proposal list and the
        // authoritative state in separate failure domains: a refresh failure
        // must never be reported as a decision failure. Authoritative refresh
        // updates the branch selector when a branch proposal is approved.
        try {
          await loadPendingProposals();
          setProposalsError(null);
          await refreshAuthoritativeState();
        } catch (refreshErr) {
          // The decision already committed (200 from /review/decide). Report
          // only the refresh problem, with a distinct, accurate message.
          if (refreshErr.status === 401) {
            setOperatorSignedIn(false);
          } else {
            setProposalsError('Decision applied, but the proposal list could not be refreshed. Try again later.');
          }
        } finally {
          setDecidingProposal(null);
        }
      }

      // loadMigrationPreview() -> Promise<void>
      //   input: none (requires operatorSignedIn). POSTs /import/preview
      //     (session cookie, read-only dry-run — no write occurs) with the
      //     subset of the six sa_* keys that hold non-empty local progress.
      //     Browsers throw when a body is attached to GET/HEAD (verified
      //     empirically), so the preview is POSTed to the SAME /import/preview
      //     path. The preview only needs keys + row counts + resulting version
      //     (DESIGN.md), never the full values, so the payload carries just
      //     marker keys — never stored by the server, unknown keys ignored.
      //   output success (200): migrationPreview := { conflict,
      //     current_version, keys_imported, ignored_keys, resulting_version }.
      //     output 401: signed out + visible message. output other: visible
      //     generic message; preview stays absent, tab usable.
      //   Pre-condition: operatorSignedIn === true. Post-condition: no
      //     localStorage read/write; the dry-run never mutates D1 or client
      //     state.
      //   Side effect: one read-only POST /import/preview.
      async function loadMigrationPreview() {
        if (!operatorSignedIn) return;
        setMigrationLoading(true);
        try {
          const previewPayload = Object.fromEntries(
            migrationKeys.map((key) => [key, true])
          );
          const data = await fetchJson('/import/preview', {
            method: 'POST',
            body: previewPayload,
          });
          setMigrationPreview(data);
          setMigrationError(null);
        } catch (err) {
          if (err.status === 401) {
            setOperatorSignedIn(false);
            setMigrationError('Sign-in expired. Please sign in again.');
          } else {
            setMigrationError('Unable to load the migration preview right now. Try again later.');
          }
        } finally {
          setMigrationLoading(false);
        }
      }

      // handleMigrate() -> Promise<void>
      //   input: none (reads closed-over local state). POSTs the six existing
      //     sa_* keys only to /import with credentials: 'same-origin'.
      //   output success (200): success message + preview refreshed (conflict
      //     card shown since D1 now holds a snapshot). output 409
      //     IMPORT_CONFLICT: visible conflict message, no overwrite path
      //     offered, preview refreshed. output 401 / 403 / 400 / 503 /
      //     network: visible message; local state never touched by the server.
      //   Pre-condition: operator signed in; invoked only by an explicit
      //     operator click — never automatic, never on load.
      //   Post-condition: no new localStorage key; existing progress never
      //     overwritten or silently re-based.
      //   Side effect: one POST /import (state-changing, CSRF-checked) which
      //     creates a new immutable snapshot version in D1; followed by one
      //     GET /import/preview.
      async function handleMigrate() {
        setMigrating(true);
        setMigrationError(null);
        try {
          // MECHANICAL: POST /import accepts only the six known sa_* keys
          // (functions/import.js KNOWN_KEYS); other keys are ignored, so the
          // payload must use the sa_* names exactly.
          const payload = {
            sa_tasks: tasks,
            sa_gates: gates,
            sa_assessments: assessments,
            sa_branch: branch,
            sa_portfolio: portfolio,
            sa_applications: applications
          };
          await fetchJson('/import', { method: 'POST', body: payload });
          setMigrationResult('Imported into D1 as a new immutable snapshot.');
          await loadMigrationPreview();
        } catch (err) {
          if (err.status === 401) {
            setOperatorSignedIn(false);
            setMigrationError('Sign-in expired. Please sign in again.');
          } else if (err.status === 403) {
            setMigrationError('Import was rejected by the server.');
          } else if (err.status === 409) {
            setMigrationError('Import conflict: D1 already holds approved state. Existing state is never overwritten.');
            await loadMigrationPreview();
          } else {
            setMigrationError('Import is unavailable right now. Try again later.');
          }
        } finally {
          setMigrating(false);
        }
      }

                h('div', { className: "text-xs text-gray-300" }, `${ev.project_evidence.ref} — ${ev.project_evidence.note}`)
              ),
              h('div', { className: axis },
                h('div', { className: "flex items-start gap-1 mb-1" },
                  h('span', { className: "font-semibold text-xs text-gray-400 uppercase" }, 'AI-assisted execution'),
                  h('span', { className: `text-xs font-medium ${ev.ai_assisted.value ? 'text-yellow-400' : 'text-gray-500'}` }, ev.ai_assisted.note)
                )
              ),
              h('div', { className: axis },
                h('div', { className: "flex items-start gap-1 mb-1" },
                  h('span', { className: "font-semibold text-xs text-gray-400 uppercase" }, 'Independently tested'),
                  h('span', { className: "text-xs font-medium text-gray-500" }, 'NOT DEMONSTRATED')
                ),
                h('div', { className: "text-xs text-gray-300" }, ev.independent.note)
              )
            );
          })
        )
      );

      const renderBranches = () => h('div', { key: 'tab-branches', className: "space-y-6" },
        h('div', null,
          h('h2', { className: "text-2xl font-bold text-white" }, 'Lateral Move Board'),
          h('p', { className: "text-gray-400 mt-1" }, 'Weeks 1-6 are common core. Choose specialization using observed learning velocity, project quality, and live-market response—not prestige.')
        ),
        h('div', { className: "grid grid-cols-1 lg:grid-cols-3 gap-6" },
          ...BRANCHES.map(b =>
            h('div', {
              key: b.id,
              className: `border rounded-xl p-6 relative transition-all ${
                branch === b.id
                  ? 'bg-purple-900/20 border-purple-500 ring-1'
                  : 'bg-gray-800 border-gray-700 hover:border-gray-500'
              }`
            },
              branch === b.id ? h('div', { className: "absolute top-0 right-0 bg-purple-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg rounded-tr-lg" }, 'SELECTED') : null,
              h('div', { className: "text-xs font-bold text-gray-400 uppercase tracking-wider mb-2" }, b.type),
              h('h3', { className: "text-xl font-bold text-white mb-4" }, b.name),
              h('div', { className: "space-y-4 text-sm" },
                h('div', null,
                  h('span', { className: "text-gray-400 block mb-1" }, 'Target Identity:'),
                  h('span', { className: "text-gray-200 font-medium" }, b.target)
                ),
                h('div', null,
                  h('span', { className: "text-gray-400 block mb-1" }, 'Core additions:'),
                  h('span', { className: "text-gray-300" }, b.core)
                ),
                h('div', null,
                  h('span', { className: "text-gray-400 block mb-1" }, 'Why:'),
                  h('span', { className: "text-gray-300 italic" }, `"${b.reason}"`)
                )
              ),
              h('button', {
                type: 'button',
                onClick: () => setBranch(b.id),
                className: `mt-6 w-full py-2 rounded-lg font-bold transition-colors ${
                  branch === b.id
                    ? 'bg-purple-600 hover:bg-purple-700 text-white'
                    : 'bg-gray-700 hover:bg-gray-600 text-gray-200'
                }`
              }, branch === b.id ? 'Active Branch' : 'Select Branch')
            )
          )
        )
      );

      const renderPortfolio = () => h('div', { key: 'tab-portfolio', className: "space-y-6" },
        h('div', { className: "flex justify-between items-end border-b border-gray-700 pb-4" },
          h('div', null,
            h('h2', { className: "text-2xl font-bold text-white" }, 'Portfolio Operating System'),
            h('p', { className: "text-gray-400 mt-1" }, 'The portfolio is a transmitter, not a storage folder. Implement the 72-hour emission rule.')
          )
        ),
        ...PORTFOLIO_PROJECTS.map(project =>
          h('div', { key: project.id, className: "bg-gray-800 border border-gray-700 rounded-xl p-5" },
            h('div', { className: "flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4" },
              h('div', null,
                h('h3', { className: "text-lg font-bold text-white" }, project.name),
                h('p', { className: "text-gray-400 text-sm" }, `Proof: ${project.proof}`)
              ),
              h('div', { className: "flex items-center gap-2" },
                h('input', {
                  type: 'text',
                  placeholder: 'https://github.com/...',
                  value: portfolio[`${project.id}_link`] || '',
                  onChange: (e) => handlePortfolioLink(project.id, e.target.value),
                  className: "bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-200 w-64 focus:outline-none focus:border-blue-500"
                }),
                h('a', {
                  href: portfolio[`${project.id}_link`] || '#',
                  target: '_blank',
                  rel: 'noreferrer',
                  className: `p-1.5 rounded-lg ${portfolio[`${project.id}_link`] ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-700 text-gray-500 cursor-not-allowed'}`
                }, h(ExternalLink, { size: 16 }))
              )
            ),
            h('div', { className: "grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3" },
              ...SIGNALS.map(signal => {
                const key = `${project.id}_${signal.id}`;
                const isEmitted = Boolean(portfolio[key]);
                return h('button', {
                  type: 'button',
                  key,
                  onClick: () => handlePortfolioSignal(project.id, signal.id, !isEmitted),
                  className: `p-3 rounded-lg border text-left transition-colors flex flex-col gap-2 ${
                    isEmitted
                      ? 'bg-blue-900/20 border-blue-800 text-blue-400'
                      : 'bg-gray-900 border-gray-700 text-gray-400 hover:border-gray-500'
                  }`
                },
                  h('div', { className: "flex justify-between items-start w-full" },
                    h('span', { className: "text-xs font-bold truncate pr-2" }, signal.name),
                    isEmitted ? h(CheckCircle2, { size: 14, className: "text-blue-500 shrink-0" }) : null
                  ),
                  h('span', { className: "text-[10px] leading-tight opacity-80" }, signal.channel)
                );
              })
            )
          )
        )
      );

      const renderApplications = () => h('div', { key: 'tab-applications', className: "space-y-6" },
        h('div', null,
          h('h2', { className: "text-2xl font-bold text-white" }, 'Application Cohort Strategy'),
          h('p', { className: "text-gray-400 mt-1" }, 'Let the job search evolve with the person. Track conversion rates by cohort.')
        ),
        h('div', { className: "overflow-x-auto" },
          h('table', { className: "w-full text-left border-collapse" },
            h('thead', null,
              h('tr', null,
                h('th', { className: "p-3 border-b border-gray-700 text-gray-400 font-medium" }, 'Cohort'),
                h('th', { className: "p-3 border-b border-gray-700 text-gray-400 font-medium" }, 'Target Range'),
                h('th', { className: "p-3 border-b border-gray-700 text-gray-400 font-medium text-center" }, 'Applied'),
                h('th', { className: "p-3 border-b border-gray-700 text-gray-400 font-medium text-center" }, 'Recruiter Screen'),
                h('th', { className: "p-3 border-b border-gray-700 text-gray-400 font-medium text-center" }, 'Tech Interview')
              )
            ),
            h('tbody', null,
              ...COHORTS.map(cohort =>
                h('tr', { key: cohort.id, className: "border-b border-gray-800" },
                  h('td', { className: "p-3" },
                    h('div', { className: "font-bold text-gray-200" }, cohort.name),
                    h('div', { className: "text-xs text-gray-500" }, cohort.titles)
                  ),
                  h('td', { className: "p-3 text-sm text-gray-400" }, `~${cohort.target}`),
                  ...['applied', 'screens', 'tech'].map(field =>
                    h('td', { key: field, className: "p-3 text-center" },
                      h('div', { className: "flex items-center justify-center gap-2" },
                        h('button', {
                          type: 'button',
                          onClick: () => handleAppChange(cohort.id, field, -1),
                          className: "w-6 h-6 rounded bg-gray-700 text-gray-300 hover:bg-gray-600 flex items-center justify-center"
                        }, '-'),
                        h('span', { className: "w-8 text-center font-bold text-white" },
                          String((applications[cohort.id] && applications[cohort.id][field]) || 0)
                        ),
                        h('button', {
                          type: 'button',
                          onClick: () => handleAppChange(cohort.id, field, 1),
                          className: "w-6 h-6 rounded bg-gray-700 text-gray-300 hover:bg-gray-600 flex items-center justify-center"
                        }, '+')
                      )
                    )
                  )
                )
              )
            )
          )
        ),
        h('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-4 mt-6" },
          h('div', { className: "bg-gray-800 border border-gray-700 rounded-xl p-5" },
            h('h3', { className: "font-bold text-white mb-2" }, 'Relocation Gate'),
            h('p', { className: "text-sm text-gray-300" },
              'Do not resign or relocate for a possibility. Move when role, legal work status, start date, compensation, location/work model and probation risk are understood well enough to make the move rational.'
            )
          ),
          h('div', { className: "bg-gray-800 border border-gray-700 rounded-xl p-5" },
            h('h3', { className: "font-bold text-white mb-2" }, 'Czech Objective'),
            h('p', { className: "text-sm text-gray-300" },
              'Remote work is attractive, but a Prague/Brno hybrid role may advance both career and relationship goals faster than a remote Portuguese support role.'
            )
          )
        )
      );

      const handleExport = () => {
        const data = { tasks, gates, assessments, branch, portfolio, applications };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `signal-augmented-backup-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      const handleImport = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.tasks) setTasks(data.tasks);
            if (data.gates) setGates(data.gates);
            if (data.assessments) setAssessments(data.assessments);
            if (data.branch !== undefined) setBranch(data.branch);
            if (data.portfolio) setPortfolio(data.portfolio);
            if (data.applications) setApplications(data.applications);
            alert('Data imported successfully.');
          } catch (err) {
            console.error("Failed to parse JSON", err);
          }
        };
        reader.readAsText(file);
      };

      const renderSettings = () => h('div', { key: 'tab-settings', className: "space-y-6 max-w-2xl" },
        h('div', null,
          h('h2', { className: "text-2xl font-bold text-white" }, 'Data Management'),
          h('p', { className: "text-gray-400 mt-1" }, 'Backup your progress locally. Cloud storage integration is recommended for cross-device sync.')
        ),
        h('div', { className: "bg-gray-800 border border-gray-700 rounded-xl p-6 space-y-6" },
          h('div', null,
            h('h3', { className: "text-lg font-bold text-white mb-2" }, 'Export Data'),
            h('p', { className: "text-sm text-gray-400 mb-4" }, 'Download a JSON file containing all your current progress, assessment scores, and portfolio links.'),
            h('button', {
              type: 'button',
              onClick: handleExport,
              className: "flex items-center gap-2 bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium transition-colors"
            }, h(Download, { size: 18 }), ' Export to JSON')
          ),
          h('div', { className: "border-t border-gray-700 pt-6" },
            h('h3', { className: "text-lg font-bold text-white mb-2" }, 'Import Data'),
            h('p', { className: "text-sm text-gray-400 mb-4" }, 'Restore your progress from a previously exported JSON file. This will overwrite current session data.'),
            h('label', { className: "flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors cursor-pointer w-fit" },
              h(Upload, { size: 18 }),
              ' Import JSON',
              h('input', { type: 'file', accept: '.json', onChange: handleImport, className: "hidden" })
            )
          ),
          // --- OPERATOR SIGN-IN (additive, settings tab) ---
          h('div', { className: "border-t border-gray-700 pt-6" },
            h('h3', { className: "text-lg font-bold text-white mb-2" }, 'Operator Sign-In'),
            h('p', { className: "text-sm text-gray-400 mb-4" }, 'Sign in to review pending agent proposals and import your local backup into D1. The session cookie is stored by the browser only; this page never reads it.'),
            operatorSignedIn
              ? h('div', { className: "flex items-center gap-3" },
                  h('span', { className: "flex items-center gap-1 text-sm text-green-400" }, h(CheckCircle2, { size: 14 }), ' Signed in as operator'),
                  h('button', {
                    type: 'button',
                    onClick: handleSignOut,
                    className: "text-sm font-medium text-gray-400 hover:text-gray-200 transition-colors"
                  }, 'Sign out')
                )
              : h('div', null,
                  h('div', { className: "flex gap-2 mb-3" },
                    h('input', {
                      type: 'password',
                      placeholder: 'Password',
                      value: signInPassword,
                      onChange: (e) => setSignInPassword(e.target.value),
                      className: "bg-gray-900 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-200 w-64 focus:outline-none focus:border-blue-500"
                    }),
                    h('button', {
                      type: 'button',
                      disabled: signingIn,
                      onClick: handleSignIn,
                      className: `px-4 py-2 rounded-lg font-medium transition-colors ${signingIn ? 'bg-gray-600 cursor-not-allowed opacity-80' : 'bg-blue-600 hover:bg-blue-700 text-white'}`
                    }, signingIn ? 'Signing in...' : 'Sign in')
                  ),
                  signInError && h('div', { className: "mt-3 p-3 rounded-lg border border-yellow-800 bg-yellow-900/30 text-yellow-400 text-xs" }, signInError)
                )
          ),
          // --- PENDING PROPOSALS (O2.1, additive, settings tab) ---
          h('div', { className: "border-t border-gray-700 pt-6" },
            h('h3', { className: "text-lg font-bold text-white mb-2" }, 'Pending Proposals Awaiting Your Approval'),
            h('p', { className: "text-sm text-gray-400 mb-4" }, 'The agent proposes (PENDING only). You approve or reject; nothing is applied without your decision.'),
            !operatorSignedIn
              ? h('p', { className: "text-sm text-gray-500" }, 'Sign in above to load pending proposals.')
              : h('div', null,
                  proposalsError && h('div', { className: "mb-4 p-3 rounded-lg border border-yellow-800 bg-yellow-900/30 text-yellow-400 text-xs" }, proposalsError),
                  h('div', { className: "space-y-3" },
                    pendingProposals.length === 0
                      ? h('div', { className: "bg-gray-800 border border-gray-700 rounded-lg p-6 text-center" },
                          h('p', { className: "text-gray-400 text-sm" }, 'No pending proposals awaiting your approval.'),
                          h('p', { className: "text-xs text-gray-500 mt-1" }, 'The agent proposes; nothing waits for your decision.')
                        )
                      : pendingProposals.map((proposal) => h('div', {
                          key: proposal.proposal_id,
                          className: "border border-gray-700 rounded-lg p-4 mb-3"
                        },
                          h('div', { className: "flex justify-between items-start mb-3" },
                            h('div', null,
                              h('span', { className: "font-bold text-gray-200 text-sm truncate" }, String(proposal.proposal_id)),
                              h('span', { className: "ml-2 px-2 py-0.5 rounded-md text-xs font-bold border border-gray-700 bg-gray-800 text-gray-400" }, 'PENDING')
                            ),
                            h('span', { className: "text-xs text-gray-500 truncate" }, String(proposal.created_at || ''))
                          ),
                          h('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
                            h('div', null,
                              h('div', { className: "text-xs font-medium text-gray-400 uppercase mb-1" }, 'Before'),
                              h('div', { className: "overflow-x-auto bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-gray-300" }, JSON.stringify(proposal.before ?? null))
                            ),
                            h('div', null,
                              h('div', { className: "text-xs font-medium text-gray-400 uppercase mb-1" }, 'After'),
                              h('div', { className: "overflow-x-auto bg-gray-900 border border-gray-700 rounded-lg p-2 text-xs text-gray-300" }, JSON.stringify(proposal.after ?? null))
                            )
                          ),
                          h('div', { className: "mt-4 flex items-center gap-2" },
                            h('button', {
                              type: 'button',
                              disabled: decidingProposal === proposal.proposal_id,
                              onClick: () => handleDecide(proposal.proposal_id, 'APPROVE'),
                              className: `px-3 py-1.5 rounded-md font-medium text-xs transition-colors ${decidingProposal === proposal.proposal_id ? 'cursor-not-allowed opacity-80' : 'bg-green-900/20 border border-green-800 text-green-400'}`
                            }, 'Approve'),
                            h('button', {
                              type: 'button',
                              disabled: decidingProposal === proposal.proposal_id,
                              onClick: () => handleDecide(proposal.proposal_id, 'REJECT'),
                              className: `px-3 py-1.5 rounded-md font-medium text-xs transition-colors ${decidingProposal === proposal.proposal_id ? 'cursor-not-allowed opacity-80' : 'bg-gray-900 border border-gray-700 text-gray-400 hover:bg-gray-800 hover:text-gray-200'}`
                            }, 'Reject')
                          )
                        )
                      )
                  )
                )
          ),
          // --- MIGRATION PREVIEW (Decision 3, additive, settings tab) ---
          h('div', { className: "border-t border-gray-700 pt-6" },
            h('h3', { className: "text-lg font-bold text-white mb-2" }, 'Migration — Local Backup to D1'),
            h('p', { className: "text-sm text-gray-400 mb-4" }, 'One-time import of your local backup into D1 as a new immutable snapshot. Existing approved state is never overwritten and there is no auto-migration — you must click Migrate explicitly.'),
            migrationResult && h('p', { className: "mt-2 mb-4 text-sm text-green-400" }, migrationResult),
            !operatorSignedIn
              ? h('p', { className: "text-sm text-gray-500" }, 'Sign in above to load the migration preview.')
              : migrationLoading
                ? h('p', { className: "text-sm text-gray-500" }, 'Loading migration preview...')
                : migrationError
                  ? h('div', { className: "mb-4 p-3 rounded-lg border border-yellow-800 bg-yellow-900/30 text-yellow-400 text-xs" }, migrationError)
                  : migrationPreview
                    ? migrationPreview.conflict
                      ? h('div', { className: "bg-yellow-900/30 border border-yellow-800 rounded-lg p-5" },
                          h('h4', { className: "font-bold text-white mb-2" }, 'Migration blocked — approved state already exists'),
                          h('p', { className: "text-sm text-gray-300 mb-2" }, `D1 already holds approved snapshot v${String(migrationPreview.current_version)}.`),
                          h('p', { className: "text-sm text-gray-400" }, 'Existing approved state is never overwritten. No overwrite path is offered.')
                        )
                      : migrationKeys.length === 0
                        ? h('p', { className: "text-sm text-gray-500" }, 'No local progress to migrate.')
                        : h('div', { className: "bg-gray-800 border border-gray-700 rounded-lg p-5 space-y-3" },
                            h('h4', { className: "font-bold text-white mb-2" }, 'Migration preview — what would be imported'),
                            h('p', { className: "text-sm text-gray-300 mb-3" }, 'D1 is empty. Your local backup would be imported as a new immutable snapshot. Unknown keys are ignored by the server.'),
                            h('div', { className: "text-xs font-medium text-gray-400 uppercase mb-1" }, 'Local keys to import'),
                            h('div', { className: "space-y-1 mb-3" },
                              ...migrationKeys.map((key) => h('div', { key: key, className: "text-sm text-gray-300 truncate" }, key))
                            ),
                            h('div', { className: "text-xs text-gray-500 mb-3" }, `Resulting snapshot version: v${String(migrationPreview.resulting_version)}`),
                            h('button', {
                              type: 'button',
                              disabled: migrating,
                              onClick: handleMigrate,
                              className: `px-4 py-2 rounded-lg font-medium transition-colors ${migrating ? 'bg-gray-600 cursor-not-allowed opacity-80' : 'bg-blue-600 hover:bg-blue-700 text-white'}`
                            }, migrating ? 'Migrating...' : 'Migrate')
                          )
                    : h('p', { className: "text-sm text-gray-500" }, 'No migration preview available.'),
          )
        )
      );

      const tabs = [
        { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard },
        { id: 'roadmap', label: '12-Week Roadmap', icon: MapIcon },
        { id: 'assessments', label: 'Assessments', icon: ShieldCheck },
        { id: 'branches', label: 'Career Branches', icon: GitBranch },
        { id: 'portfolio', label: 'Portfolio Signals', icon: FolderOpen },
        { id: 'applications', label: 'Job Applications', icon: Briefcase },
        { id: 'settings', label: 'Data & Backup', icon: Settings }
      ];

      return h('div', { className: "flex h-screen bg-gray-950 font-sans text-gray-100" },
        // Sidebar
        h('div', { className: "w-64 bg-gray-900 border-r border-gray-800 flex flex-col" },
          h('div', { className: "p-6" },
            h('h1', { className: "text-lg font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r" }, 'SIGNAL AUGMENTED'),
            h('div', { className: "text-xs font-medium text-gray-500 mt-1 uppercase tracking-widest" }, 'Filipe Vitorino')
          ),
          h('nav', { className: "flex-1 px-4 space-y-1 overflow-y-auto" },
            ...tabs.map(tab => {
              const Icon = tab.icon;
              const isActive = activeTab === tab.id;
              return h('button', {
                type: 'button',
                key: tab.id,
                onClick: () => setActiveTab(tab.id),
                className: `w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${
                  isActive
                    ? 'bg-blue-600/10 text-blue-400'
                    : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'
                }`
              },
                h(Icon, { size: 18, className: isActive ? 'text-blue-500' : 'text-gray-500' }),
                h('span', null, tab.label)
              );
            })
          ),
          h('div', { className: "p-4 border-t border-gray-800" },
            h('div', { className: "bg-gray-800 rounded-lg p-3" },
              h('div', { className: "text-xs text-gray-400 mb-1" }, 'Overall Progress'),
              h('div', { className: "w-full bg-gray-900 rounded-full h-1.5 mb-2" },
                h('div', { className: "bg-blue-500 h-1.5 rounded-full", style: { width: `${progressStats.completionPercent}%` } })
              ),
              h('div', { className: "flex justify-between text-xs font-medium" },
                h('span', { className: "text-white" }, `${progressStats.independentTasks} Mastered`),
                h('span', { className: "text-gray-500" }, `${progressStats.totalTasks} Total`)
              )
            )
          )
        ),
        // Main Content
        h('div', { className: "flex-1 overflow-y-auto p-8" },
          h('div', { className: "max-w-5xl mx-auto" },
            activeTab === 'dashboard' ? renderDashboard() :
            activeTab === 'roadmap' ? renderRoadmap() :
            activeTab === 'assessments' ? renderAssessments() :
            activeTab === 'branches' ? renderBranches() :
            activeTab === 'portfolio' ? renderPortfolio() :
            activeTab === 'applications' ? renderApplications() :
            renderSettings()
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
