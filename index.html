<head>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    /* --- HIGH-CONTRAST WORKSTATION PALETTE --- */
    :root {
      --bg-topbar: #4A2552;
      --bg-canvas: #DDE7EA;
      --bg-window: #FFFFFF;
      --bg-subtle: #EDF3F5;
      --cyan-soft: #79BAC1;
      --teal-deep: #2A7886;
      --plum-deep: #4A2552;
      --ink-main: #1E1721;
      --ink-muted: #49585E;
      --border-os: #2A7886;
      --border-plum: #4A2552;
      --font-display: 'Chakra Petch', sans-serif;
      --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    *, ::before, ::after {
      box-sizing: border-box;
      border-width: 0;
      border-style: solid;
      border-color: var(--border-os);
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-canvas);
      color: var(--ink-main);
      font-family: var(--font-sans);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, p { margin: 0; }
    button, input, select, textarea {
      font-family: inherit;
      font-size: 100%;
      line-height: inherit;
      color: inherit;
      margin: 0;
      padding: 0;
      background-color: transparent;
    }
    button, select { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    table { border-collapse: collapse; width: 100%; }

    .font-display { font-family: var(--font-display); }
    .font-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* Cool Slate Workstation Canvas */
    .os-desktop {
      background-color: var(--bg-canvas);
      background-image: radial-gradient(rgba(42, 120, 134, 0.18) 1px, transparent 0);
      background-size: 10px 10px;
    }

    .os-window {
      background-color: var(--bg-window);
      border: 1.5px solid var(--plum-deep);
      box-shadow: 3px 3px 0px rgba(36, 21, 41, 0.15);
    }

    .os-titlebar {
      background-color: var(--plum-deep);
      color: #F4F7F8;
      padding: 0.5rem 0.95rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.35rem 0.85rem;
      border-bottom: 1.5px solid var(--plum-deep);
    }

    .os-titlebar-teal {
      background-color: var(--teal-deep);
      color: #FFFFFF;
    }

    .os-panel {
      background-color: var(--bg-subtle);
      border: 1px solid rgba(42, 120, 134, 0.42);
    }

    .os-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      background-color: var(--bg-subtle);
      color: var(--plum-deep);
      border: 1.5px solid var(--plum-deep);
      box-shadow: 2px 2px 0px rgba(36, 21, 41, 0.16);
      transition: transform 100ms ease, background-color 120ms ease;
    }

    .os-btn:hover {
      background-color: var(--cyan-soft);
      color: var(--ink-main);
    }

    .os-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px rgba(36, 21, 41, 0.16);
    }

    .os-btn-primary {
      background-color: var(--plum-deep);
      color: #FFFFFF;
      border-color: var(--plum-deep);
      font-weight: 600;
    }

    .os-btn-primary:hover {
      background-color: var(--teal-deep);
      color: #FFFFFF;
    }

    .os-btn-teal {
      background-color: var(--teal-deep);
      color: #FFFFFF;
      border-color: var(--plum-deep);
      font-weight: 600;
    }

    .os-btn-teal:hover {
      background-color: var(--cyan-soft);
      color: var(--plum-deep);
    }

    .os-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background-color: #FFFFFF;
      border: 1.5px solid var(--teal-deep);
      color: var(--ink-main);
      font-size: 0.85rem;
    }

    .os-input:focus {
      outline: none;
      border-color: var(--plum-deep);
      box-shadow: 2px 2px 0px rgba(121, 186, 193, 0.45);
    }

    .os-progress-track {
      width: 100%;
      height: 10px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--plum-deep);
      padding: 1px;
    }

    .os-progress-fill {
      height: 100%;
      background-color: var(--teal-deep);
      transition: width 180ms ease;
    }

    /* --- HIGH-CONTRAST DARK TOP BAR --- */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: var(--bg-topbar);
      color: #F4F7F8;
      border-bottom: 3px solid var(--teal-deep);
      box-shadow: 0 3px 12px rgba(24, 14, 28, 0.22);
      padding: 0.58rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem 2rem;
    }

    @media (max-width: 820px) {
      .top-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
      }
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-self: center;
      gap: 0.4rem 1.75rem;
    }

    .nav-link {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: #E2EEF1;
      padding: 0.18rem 0;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 120ms ease, border-color 120ms ease;
    }

    .nav-link:hover {
      color: #FFFFFF;
    }

    .nav-link-active {
      color: var(--cyan-soft);
      border-bottom-color: var(--cyan-soft);
      font-weight: 600;
    }

    /* --- 2-COLUMN WORKSPACE: LEFT PROFILE SIDEBAR + MAIN CONTENT --- */
    .shell-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 4.75rem 1.5rem;
    }

    .workspace-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (min-width: 960px) {
      .workspace-layout {
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 1.75rem;
      }
      .profile-sidebar {
        position: sticky;
        top: 4.5rem;
      }
    }

    .grid-2 { display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 1.25rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 1.15rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .grid-6 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }

    @media (min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .grid-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (min-width: 1120px) {
      .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }

    @media (max-width: 767px) {
      .top-bar { padding: 0.75rem 1rem; gap: 0.6rem 1rem; }
      .shell-container { padding: 1.15rem 0.9rem 4.5rem 0.9rem; }
      .nav-links {
        order: 3;
        width: 100%;
        padding-top: 0.45rem;
        border-top: 1px solid rgba(121, 186, 193, 0.25);
        justify-content: flex-start;
        gap: 0.35rem 1.15rem;
      }
      .nav-link { font-size: 0.78rem; }
    }

    /* --- PERSISTENT BOTTOM SCROLLING COMMIT BAR --- */
    .commit-ticker-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      height: 1.65rem;
      background-color: var(--bg-topbar);
      color: #F4F7F8;
      border-top: 2px solid var(--teal-deep);
      display: flex;
      align-items: center;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.01em;
    }

    .commit-ticker-label {
      height: 100%;
      padding: 0 0.65rem;
      background-color: var(--cyan-soft);
      color: var(--bg-topbar);
      font-weight: 700;
      font-size: 0.66rem;
      display: flex;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
      border-right: 1.5px solid var(--bg-topbar);
    }

    .commit-ticker-viewport {
      flex: 1;
      overflow: hidden;
      height: 100%;
      display: flex;
      align-items: center;
    }

    @keyframes os-marquee {
      0% { transform: translate3d(0%, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    .commit-ticker-track {
      display: flex;
      align-items: center;
      width: max-content;
      animation: os-marquee 110s linear infinite;
    }

    .commit-ticker-track:hover {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      .commit-ticker-track { animation: none; }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: rgba(24, 14, 28, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
  </style>
</head>
<body class="os-desktop notranslate" translate="no">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo } = React;
    const h = React.createElement;

    function safeGet(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSet(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    const STATUS = {
      PENDING: 'pending',
      AI_ASSISTED: 'ai_assisted',
      INDEPENDENT: 'independent'
    };

    const DEFAULT_REPO_SLUG = 'xarop-pa-toss/devblog-layer-zero';
    const BASELINE_GITHUB_INDEX_SHA = '980863e5917f5c4f147b89fe47b86975e32c5eb6';

    function normalizeRepoSlug(slug) {
      const trimmed = String(slug || '').trim();
      if (!trimmed || trimmed === 'xarop-pa-toss/layer-zero') {
        return DEFAULT_REPO_SLUG;
      }
      return trimmed;
    }

    function isGitHubPagesHost(hostname) {
      const host = String(hostname || (typeof window !== 'undefined' && window.location ? window.location.hostname : '') || '').trim().toLowerCase();
      if (!host) return false;
      return host === 'xarop.link' || host.endsWith('.xarop.link') || host.endsWith('.github.io');
    }

    function detectHostEnvironment(hostname) {
      const host = String(hostname || (typeof window !== 'undefined' && window.location ? window.location.hostname : '') || '').trim().toLowerCase();
      if (isGitHubPagesHost(host)) {
        return { id: 'github-pages', label: 'GitHub Pages (xarop.link)' };
      }
      if (host.endsWith('.ai.studio') || host.endsWith('.run.app')) {
        return { id: 'ai-studio', label: 'AI Studio' };
      }
      return { id: 'local', label: 'Local Workstation' };
    }

    function decodeGitHubBase64(b64) {
      try {
        const clean = String(b64 || '').replace(/\s+/g, '');
        const binStr = atob(clean);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) {
          bytes[i] = binStr.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      } catch (e) {
        return '';
      }
    }

    async function fetchGitHubFileText(repoSlug, filePath, branch = 'main', fileSha = '') {
      const cleanRepo = normalizeRepoSlug(repoSlug);
      const cleanPath = String(filePath || '').replace(/^\/+/, '');
      const cb = Date.now();

      try {
        const apiUrl = `https://api.github.com/repos/${cleanRepo}/contents/${cleanPath}?ref=${encodeURIComponent(branch)}&_t=${cb}`;
        const apiRes = await fetch(apiUrl, {
          headers: { 'Accept': 'application/vnd.github.v3+json' },
          cache: 'no-store'
        });
        if (apiRes.ok) {
          const item = await apiRes.json();
          if (item && item.content && item.encoding === 'base64') {
            const decoded = decodeGitHubBase64(item.content);
            if (decoded) return decoded;
          }
        }
      } catch (e) {}

      if (fileSha) {
        try {
          const blobRes = await fetch(`https://api.github.com/repos/${cleanRepo}/git/blobs/${fileSha}`, {
            headers: { 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          });
          if (blobRes.ok) {
            const blobData = await blobRes.json();
            if (blobData && blobData.content && blobData.encoding === 'base64') {
              const decoded = decodeGitHubBase64(blobData.content);
              if (decoded) return decoded;
            }
          }
        } catch (e) {}
      }

      try {
        const rawRes = await fetch(`https://raw.githubusercontent.com/${cleanRepo}/${branch}/${cleanPath}?t=${cb}`, {
          cache: 'no-store'
        });
        if (rawRes.ok) {
          return await rawRes.text();
        }
      } catch (e) {}

      return null;
    }

    const DEFAULT_UI_CONFIG = {
      brandTitle: 'xarop.link',
      hero: {
        windowTitle: 'xarop.link — Ricardo Giro',
        headline: 'Ricardo Giro — Infrastructure, DevOps & .NET',
        activeProjectLabel: 'Active Project:',
        activeProjectName: 'Flaggo',
        activeProjectText: '— self-hosted 4-app feature flag & runtime config platform.',
        buttons: [
          {
            id: 'btn-flaggo',
            label: 'Operation Flaggo ({opPassedGates}/{opTotalGates} Gates)',
            actionType: 'section',
            target: 'operation',
            variant: 'primary',
            enabled: true
          },
          {
            id: 'btn-roadmap',
            label: 'DevOps Roadmap ({completionPercent}%)',
            actionType: 'section',
            target: 'roadmap',
            variant: 'teal',
            enabled: true
          },
          {
            id: 'btn-projects',
            label: 'Other Stuff',
            actionType: 'section',
            target: 'projects',
            variant: 'default',
            enabled: true
          },
          {
            id: 'btn-github',
            label: 'GitHub ->',
            actionType: 'external',
            target: 'https://github.com/xarop-pa-toss',
            variant: 'default',
            enabled: true
          }
        ]
      },
      navItems: [
        { id: 'logs', label: 'The Logs', enabled: true },
        { id: 'roadmap', label: 'DevOps Roadmap', enabled: true },
        { id: 'operation', label: 'Operation Flaggo', enabled: true },
        { id: 'projects', label: 'Other Stuff', enabled: true }
      ]
    };

    function extractHtmlBootPayload(rawHtml) {
      const html = String(rawHtml || '');
      const styles = [];
      const styleRegex = /<style\b[^>]*>([\s\S]*?)<\/style>/gi;
      let styleMatch;
      while ((styleMatch = styleRegex.exec(html)) !== null) {
        if (styleMatch[1] && styleMatch[1].trim()) {
          styles.push(styleMatch[1]);
        }
      }

      let appScript = '';
      const scriptRegex = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
      let scriptMatch;
      while ((scriptMatch = scriptRegex.exec(html)) !== null) {
        const attrs = scriptMatch[1] || '';
        const body = scriptMatch[2] || '';
        if (/\bsrc\s*=/i.test(attrs)) continue;
        if (body.trim().length > appScript.length) {
          appScript = body.replace(/xarop-pa-toss\/layer-zero/g, DEFAULT_REPO_SLUG);
        }
      }

      return { styles, appScript };
    }

    function shouldExecuteRemoteIndex(remoteSha, baselineSha = BASELINE_GITHUB_INDEX_SHA, forceRemote = false) {
      const cleanRemote = String(remoteSha || '').trim();
      if (!cleanRemote) return false;
      if (forceRemote) return true;
      return cleanRemote !== baselineSha;
    }

    function resolveUiConfig(partialUi, defaults = DEFAULT_UI_CONFIG) {
      if (!partialUi || typeof partialUi !== 'object') {
        return {
          ...defaults,
          hero: {
            ...defaults.hero,
            buttons: defaults.hero.buttons.filter(b => b.enabled !== false && b.target !== 'keebs')
          },
          navItems: defaults.navItems.filter(n => n.enabled !== false && n.id !== 'keebs')
        };
      }

      const rawHero = (partialUi.hero && typeof partialUi.hero === 'object') ? partialUi.hero : {};
      const rawButtons = Array.isArray(rawHero.buttons) ? rawHero.buttons : defaults.hero.buttons;
      const rawNavItems = Array.isArray(partialUi.navItems) ? partialUi.navItems : defaults.navItems;
      const rawBrand = (typeof partialUi.brandTitle === 'string' && partialUi.brandTitle.trim())
        ? partialUi.brandTitle.trim()
        : defaults.brandTitle;

      return {
        brandTitle: rawBrand === 'Layer Zero' ? 'xarop.link' : rawBrand,
        hero: {
          windowTitle: (typeof rawHero.windowTitle === 'string' && rawHero.windowTitle.trim())
            ? rawHero.windowTitle.replace(/Layer Zero/g, 'xarop.link')
            : defaults.hero.windowTitle,
          headline: (typeof rawHero.headline === 'string' && rawHero.headline.trim())
            ? rawHero.headline.trim()
            : defaults.hero.headline,
          activeProjectLabel: typeof rawHero.activeProjectLabel === 'string'
            ? rawHero.activeProjectLabel
            : defaults.hero.activeProjectLabel,
          activeProjectName: typeof rawHero.activeProjectName === 'string'
            ? rawHero.activeProjectName
            : defaults.hero.activeProjectName,
          activeProjectText: typeof rawHero.activeProjectText === 'string'
            ? rawHero.activeProjectText
            : defaults.hero.activeProjectText,
          buttons: rawButtons.filter(b => b && b.enabled !== false && b.target !== 'keebs')
        },
        navItems: rawNavItems.filter(n => n && n.enabled !== false && n.id !== 'keebs')
      };
    }

    function interpolateButtonLabel(template, stats) {
      return String(template || '')
        .replace(/\{opPassedGates\}/g, String((stats && stats.opPassedGates) ?? 0))
        .replace(/\{opTotalGates\}/g, String((stats && stats.opTotalGates) ?? 0))
        .replace(/\{completionPercent\}/g, String((stats && stats.completionPercent) ?? 0));
    }

    function applyRemoteBootPayload(payload, sha) {
      if (!payload || !payload.appScript) return false;
      try {
        if (Array.isArray(payload.styles) && payload.styles.length > 0) {
          const styleEl = document.querySelector('head style') || document.createElement('style');
          styleEl.textContent = payload.styles.join('\n');
          if (!styleEl.parentNode) {
            document.head.appendChild(styleEl);
          }
        }
        window.__LZ_REMOTE_ACTIVE__ = true;
        window.__LZ_BOOT_MODE__ = 'github-live';
        window.__LZ_INDEX_BLOB_SHA__ = String(sha || '').slice(0, 7);
        const runner = new Function(payload.appScript);
        runner();
        return true;
      } catch (err) {
        window.__LZ_REMOTE_ACTIVE__ = false;
        return false;
      }
    }

    async function bootFromGitHubIndexHtml(repoSlug = DEFAULT_REPO_SLUG, branch = 'main', forceOverride = false) {
      const cleanRepo = normalizeRepoSlug(repoSlug);
      const forceRemote = Boolean(forceOverride) || (typeof window !== 'undefined' && window.location && window.location.search.includes('force_remote_boot=1'));
      const host = (typeof window !== 'undefined' && window.location ? window.location.hostname : '').toLowerCase();

      // Skip remote bootloader on GitHub Pages or local/dev preview unless forced
      if ((isGitHubPagesHost(host) || host === 'localhost' || host === '127.0.0.1' || host.startsWith('ais-dev-')) && !forceRemote) {
        window.__LZ_BOOT_MODE__ = isGitHubPagesHost(host) ? 'github-pages-native' : 'local-dev';
        return false;
      }

      try {
        const apiUrl = `https://api.github.com/repos/${cleanRepo}/contents/index.html?ref=${encodeURIComponent(branch)}&_t=${Date.now()}`;
        const res = await fetch(apiUrl, {
          headers: { 'Accept': 'application/vnd.github.v3+json' },
          cache: 'no-store'
        });
        if (res.ok) {
          const item = await res.json();
          const remoteSha = (item && item.sha) ? String(item.sha) : '';
          window.__LZ_INDEX_BLOB_SHA__ = remoteSha.slice(0, 7);

          if (shouldExecuteRemoteIndex(remoteSha, BASELINE_GITHUB_INDEX_SHA, forceRemote)) {
            let rawHtml = '';
            if (item && item.content && item.encoding === 'base64') {
              rawHtml = decodeGitHubBase64(item.content);
            }
            if (!rawHtml && remoteSha) {
              rawHtml = await fetchGitHubFileText(cleanRepo, 'index.html', branch, remoteSha) || '';
            }
            // Only boot remote HTML if it already has the reworked xarop.link sidebar layout (or if forceRemote is set)
            if (rawHtml && (forceRemote || rawHtml.includes('profile-sidebar'))) {
              const payload = extractHtmlBootPayload(rawHtml);
              if (payload.appScript) {
                safeSet('lz_cached_remote_index_v2', { sha: remoteSha, styles: payload.styles, appScript: payload.appScript });
                if (applyRemoteBootPayload(payload, remoteSha)) {
                  return true;
                }
              }
            }
          } else {
            window.__LZ_BOOT_MODE__ = 'github-verified';
          }
        }
      } catch (e) {}
      return false;
    }

    const DEFAULT_BIO = {

    function parseMarkdownWithFrontmatter(rawText, fallbackName) {
      const trimmed = String(rawText || '')
        .replace(/\r\n/g, '\n')
        .replace(/Layer Zero/g, 'xarop.link')
        .replace(/\blayer-zero\b/g, 'xarop-link')
        .trim();
      const result = {
        title: String(fallbackName || 'Untitled Log').replace(/\.(md|txt)$/i, '').replace(/[-_]/g, ' '),
        date: new Date().toISOString().split('T')[0],
        tags: ['log'],
        summary: '',
        content: trimmed
      };

      if (trimmed.startsWith('---')) {
        const endMatch = trimmed.slice(3).match(/\n---\s*(\n|$)/);
        if (endMatch) {
          const endIdx = 3 + endMatch.index;
          const fmBlock = trimmed.slice(3, endIdx).trim();
          const body = trimmed.slice(endIdx + endMatch[0].length).trim();
          result.content = body;
          fmBlock.split('\n').forEach(line => {
            const colon = line.indexOf(':');
            if (colon > 0) {
              const key = line.slice(0, colon).trim().toLowerCase();
              const val = line.slice(colon + 1).trim().replace(/^["']|["']$/g, '');
              if (key === 'title' && val) result.title = val;
              if (key === 'date' && val) result.date = val;
              if (key === 'summary' && val) result.summary = val;
              if (key === 'tags' && val) {
                const cleaned = val.replace(/^\[|\]$/g, '');
                result.tags = cleaned.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
              }
            }
          });
        }
      }

      if (!result.summary) {
        const firstPara = result.content.split('\n\n').find(p => p.trim() && !p.trim().startsWith('#')) || result.content;
        result.summary = firstPara.replace(/[#*`]/g, '').trim().slice(0, 160);
      }
      return result;
    }

    function matchesLogSearchQuery(post, query) {
      const q = String(query || '').trim().toLowerCase();
      if (!q) return true;
      const title = String((post && post.title) || '').toLowerCase();
      const description = String((post && (post.summary || post.description)) || '').toLowerCase();
      return title.includes(q) || description.includes(q);
    }

    function renderInlineMarkdown(text, keyPrefix = 'inl') {
      if (!text) return null;
      const str = String(text);
      const tokenRegex = /(!\[([^\]]*)\]\(([^)]+)\))|(\[([^\]]+)\]\(([^)]+)\))|(`([^`]+)`)|(\*\*\*([^*]+)\*\*\*)|(\*\*([^*]+)\*\*)|(__([^_]+)__)|(\*([^*]+)\*)|(_([^_]+)_)/g;
      const nodes = [];
      let lastIndex = 0;
      let match;
      let idx = 0;

      while ((match = tokenRegex.exec(str)) !== null) {
        if (match.index > lastIndex) {
          nodes.push(str.slice(lastIndex, match.index));
        }
        const key = `${keyPrefix}-${idx++}`;
        if (match[1]) {
          nodes.push(h('img', {
            key,
            src: match[3],
            alt: match[2] || '',
            style: {
              maxWidth: '100%',
              height: 'auto',
              border: '1.5px solid #2A7886',
              margin: '0.5rem 0',
              display: 'block'
            }
          }));
        } else if (match[4]) {
          nodes.push(h('a', {
            key,
            href: match[6],
            target: '_blank',
            rel: 'noreferrer',
            style: {
              color: '#2A7886',
              fontWeight: 600,
              textDecoration: 'underline',
              textUnderlineOffset: '3px'
            }
          }, match[5]));
        } else if (match[7]) {
          nodes.push(h('code', {
            key,
            className: 'font-mono',
            style: {
              backgroundColor: '#EDF3F5',
              color: '#4A2552',
              padding: '0.1rem 0.38rem',
              fontSize: '0.88em',
              border: '1px solid rgba(42, 120, 134, 0.35)',
              fontWeight: 500
            }
          }, match[8]));
        } else if (match[9]) {
          nodes.push(h('strong', { key, style: { fontWeight: 700, fontStyle: 'italic', color: '#4A2552' } }, match[10]));
        } else if (match[11] || match[13]) {
          nodes.push(h('strong', { key, style: { fontWeight: 700, color: '#4A2552' } }, match[12] || match[14]));
        } else if (match[15] || match[17]) {
          nodes.push(h('em', { key, style: { fontStyle: 'italic' } }, match[16] || match[18]));
        }
        lastIndex = tokenRegex.lastIndex;
      }

      if (lastIndex < str.length) {
        nodes.push(str.slice(lastIndex));
      }
      return nodes.length === 1 && typeof nodes[0] === 'string' ? nodes[0] : nodes;
    }

    function MarkdownRenderer({ content }) {
      const normalized = String(content || '').replace(/\r\n/g, '\n');
      const lines = normalized.split('\n');
      const blocks = [];
      let i = 0;

      const isBlockStarter = (line) => {
        const t = line.trim();
        if (!t) return true;
        if (t.startsWith('```')) return true;
        if (/^(---|___|\*\*\*)\s*$/.test(t)) return true;
        if (/^#{1,6}\s+/.test(t)) return true;
        if (t.startsWith('>')) return true;
        if (/^\s*[-*+]\s+/.test(line)) return true;
        if (/^\s*\d+\.\s+/.test(line)) return true;
        return false;
      };

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (!trimmed) {
          i++;
          continue;
        }

        if (trimmed.startsWith('```')) {
          const lang = trimmed.slice(3).trim() || 'code';
          i++;
          const codeLines = [];
          while (i < lines.length && !lines[i].trim().startsWith('```')) {
            codeLines.push(lines[i]);
            i++;
          }
          if (i < lines.length && lines[i].trim().startsWith('```')) {
            i++;
          }
          blocks.push(
            h('div', {
              key: `md-code-${blocks.length}`,
              style: {
                border: '1.5px solid #2A7886',
                backgroundColor: '#1E1721',
                color: '#F4F7F8',
                margin: '0.35rem 0'
              }
            },
              h('div', {
                className: 'font-mono',
                style: {
                  backgroundColor: '#4A2552',
                  color: '#F4F7F8',
                  padding: '0.3rem 0.85rem',
                  fontSize: '11px',
                  fontWeight: 600,
                  borderBottom: '1px solid #2A7886',
                  display: 'flex',
                  justifyContent: 'space-between'
                }
              },
                h('span', null, lang.toUpperCase()),
                h('span', { style: { color: '#79BAC1', fontSize: '10.5px' } }, 'SNIPPET')
              ),
              h('pre', {
                className: 'font-mono',
                style: {
                  margin: 0,
                  padding: '0.95rem 1.15rem',
                  fontSize: '0.85rem',
                  lineHeight: 1.6,
                  overflowX: 'auto',
                  color: '#F4F7F8',
                  whiteSpace: 'pre'
                }
              }, h('code', null, codeLines.join('\n')))
            )
          );
          continue;
        }

        if (/^(---|___|\*\*\*)\s*$/.test(trimmed)) {
          blocks.push(
            h('hr', {
              key: `md-hr-${blocks.length}`,
              style: {
                border: 0,
                borderTop: '1.5px solid rgba(42, 120, 134, 0.4)',
                margin: '0.6rem 0'
              }
            })
          );
          i++;
          continue;
        }

        const headingMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
          const level = headingMatch[1].length;
          const text = headingMatch[2];
          const fontSizes = { 1: '1.45rem', 2: '1.25rem', 3: '1.1rem', 4: '1rem', 5: '0.95rem', 6: '0.9rem' };
          const tag = `h${Math.min(level + 1, 6)}`;
          blocks.push(
            h(tag, {
              key: `md-h-${blocks.length}`,
              className: 'font-display',
              style: {
                fontSize: fontSizes[level] || '1.05rem',
                fontWeight: 700,
                color: level <= 2 ? '#4A2552' : '#2A7886',
                marginTop: '0.4rem',
                marginBottom: '0.1rem'
              }
            }, renderInlineMarkdown(text, `h-${blocks.length}`))
          );
          i++;
          continue;
        }

        if (trimmed.startsWith('>')) {
          const quoteLines = [];
          while (i < lines.length && lines[i].trim().startsWith('>')) {
            quoteLines.push(lines[i].trim().replace(/^>\s?/, ''));
            i++;
          }
          blocks.push(
            h('blockquote', {
              key: `md-q-${blocks.length}`,
              className: 'os-panel',
              style: {
                margin: '0.25rem 0',
                padding: '0.75rem 1rem',
                backgroundColor: '#EDF3F5',
                color: '#1E1721',
                fontSize: '0.94rem'
              }
            }, renderInlineMarkdown(quoteLines.join(' '), `q-${blocks.length}`))
          );
          continue;
        }

        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*+]\s+/, ''));
            i++;
          }
          blocks.push(
            h('ul', {
              key: `md-ul-${blocks.length}`,
              style: {
                margin: '0.2rem 0',
                paddingLeft: '1.35rem',
                display: 'flex',
                flexDirection: 'column',
                gap: '0.35rem',
                listStyleType: 'square',
                color: '#1E1721',
                fontSize: '0.96rem'
              }
            }, items.map((item, idx) =>
              h('li', { key: idx }, renderInlineMarkdown(item, `ul-${blocks.length}-${idx}`))
            ))
          );
          continue;
        }

        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
            i++;
          }
          blocks.push(
            h('ol', {
              key: `md-ol-${blocks.length}`,
              style: {
                margin: '0.2rem 0',
                paddingLeft: '1.35rem',
                display: 'flex',
                flexDirection: 'column',
                gap: '0.35rem',
                listStyleType: 'decimal',
                color: '#1E1721',
                fontSize: '0.96rem'
              }
            }, items.map((item, idx) =>
              h('li', { key: idx }, renderInlineMarkdown(item, `ol-${blocks.length}-${idx}`))
            ))
          );
          continue;
        }

        const paraLines = [];
        while (i < lines.length && !isBlockStarter(lines[i])) {
          paraLines.push(lines[i]);
          i++;
        }
        if (paraLines.length > 0) {
          const paraChildren = [];
          paraLines.forEach((pLine, pIdx) => {
            if (pIdx > 0) paraChildren.push(h('br', { key: `br-${pIdx}` }));
            paraChildren.push(renderInlineMarkdown(pLine, `p-${blocks.length}-${pIdx}`));
          });
          blocks.push(
            h('p', {
              key: `md-p-${blocks.length}`,
              style: {
                margin: 0,
                fontSize: '0.96rem',
                lineHeight: 1.68,
                color: '#1E1721'
              }
            }, ...paraChildren)
          );
        }
      }

      return h('div', {
        style: {
          display: 'flex',
          flexDirection: 'column',
          gap: '0.95rem'
        }
      }, ...blocks);
    }

      function normalizeBioConfig(rawBio) {
        if (!rawBio || typeof rawBio !== 'object') return DEFAULT_BIO;
        const rawRole = String(rawBio.role || '').trim();
        const cleanRole = (!rawRole || rawRole === 'Infrastructure & DevOps Engineer · .NET Developer')
          ? DEFAULT_BIO.role
          : rawRole;
        return {
          ...DEFAULT_BIO,
          ...rawBio,
          name: String(rawBio.name || '').trim() || DEFAULT_BIO.name,
          handle: String(rawBio.handle || '').trim() || DEFAULT_BIO.handle,
          githubUser: String(rawBio.githubUser || '').trim() || DEFAULT_BIO.githubUser,
          githubUrl: String(rawBio.githubUrl || '').trim() || DEFAULT_BIO.githubUrl,
          logsRepo: normalizeRepoSlug(rawBio.logsRepo),
          avatarUrl: (rawBio.avatarUrl && String(rawBio.avatarUrl).trim()) || './sidebar_picture.png',
          role: cleanRole,
          summary: String(rawBio.summary || '').trim() || DEFAULT_BIO.summary,
          pitch: String(rawBio.pitch || '').trim() || DEFAULT_BIO.pitch,
          stack: String(rawBio.stack || '').trim() || DEFAULT_BIO.stack
        };
      }

      function normalizeStatusMap(rawMap) {
        if (!rawMap || typeof rawMap !== 'object') return {};
        const out = {};
        Object.keys(rawMap).forEach(key => {
          if (key.startsWith('_')) return;
          const val = rawMap[key];
          if (typeof val === 'string') {
            out[key] = val.trim().toLowerCase() || STATUS.PENDING;
          } else if (val && typeof val === 'object' && typeof val.status === 'string') {
            out[key] = val.status.trim().toLowerCase() || STATUS.PENDING;
          }
        });
        return out;
      }

      function normalizeDeliverableMap(rawMap) {
        if (!rawMap || typeof rawMap !== 'object') return {};
        const out = {};
        Object.keys(rawMap).forEach(key => {
          if (key.startsWith('_')) return;
          const val = rawMap[key];
          if (typeof val === 'boolean') {
            out[key] = val;
          } else if (val && typeof val === 'object') {
            out[key] = Boolean(val.done ?? val.status === 'independent' ?? val.status === 'done');
          }
        });
        return out;
      }

      function applyCanonicalState(data) {
        if (!data || typeof data !== 'object') return;
        if (data.bio) {
          setBio(prev => {
            const merged = normalizeBioConfig({ ...prev, ...data.bio });
            // Preserve resolved GitHub raw avatar URL if already synced
            if (prev.avatarUrl && prev.avatarUrl.startsWith('https://') && (!data.bio.avatarUrl || data.bio.avatarUrl === './sidebar_picture.png')) {
              merged.avatarUrl = prev.avatarUrl;
            }
            return merged;
          });
        }
        if (data.ui) {
          setUiConfig(resolveUiConfig(data.ui));
        }
        if (Array.isArray(data.roadmapData) && data.roadmapData.length > 0) {
          setRoadmapData(data.roadmapData);
        }
        if (Array.isArray(data.flaggoMilestones) && data.flaggoMilestones.length > 0) {
          setFlaggoMilestones(data.flaggoMilestones);
        }
        if (data.tasks) setTasks(normalizeStatusMap(data.tasks));
        if (data.gates) setGates(normalizeStatusMap(data.gates));
        if (data.opTasks) setOpTasks(normalizeStatusMap(data.opTasks));
        if (data.opGates) setOpGates(normalizeStatusMap(data.opGates));
        if (data.deliverables) setDeliverables(normalizeDeliverableMap(data.deliverables));
        if (data.assessments) setAssessments(normalizeStatusMap(data.assessments));
        if (data.branch !== undefined) setBranch(data.branch);
        if (data.portfolio) setPortfolio(data.portfolio);
        if (data.applications) setApplications(data.applications);
      }

      async function loadCanonicalStateJson(targetRepo) {
        const repoSlug = normalizeRepoSlug(targetRepo || bio.logsRepo);
        const cacheBuster = Date.now();
        let syncSource = 'local';
        let appliedData = null;

        if (!isGitHubPagesHost() && repoSlug && repoSlug.includes('/')) {
          try {
            const rawJsonText = await fetchGitHubFileText(repoSlug, 'public/state.json', 'main');
            if (rawJsonText) {
              const data = JSON.parse(rawJsonText);
              if (data && (data.bio || data.tasks || data.opTasks)) {
                appliedData = data;
                syncSource = 'github';
              }
            }
          } catch (e) {}
        }

        if (!appliedData) {
          try {
            const localRes = await fetch(`./state.json?t=${cacheBuster}`, { cache: 'no-store' });
            if (localRes.ok) {
              const localData = await localRes.json();
              if (localData && (localData.bio || localData.tasks || localData.opTasks)) {
                appliedData = localData;
                syncSource = isGitHubPagesHost() ? 'github' : 'local';
              }
            }
          } catch (e) {}
        }

        if (appliedData) {
          applyCanonicalState(appliedData);
        }

        if (repoSlug && repoSlug.includes('/')) {

          if (!isGitHubPagesHost()) {
            try {
              const pubListRes = await fetch(`https://api.github.com/repos/${repoSlug}/contents/public?ref=main&_t=${cacheBuster}`, {
                headers: { 'Accept': 'application/vnd.github.v3+json' },
                cache: 'no-store'
              });
              if (pubListRes.ok) {
                const pubItems = await pubListRes.json();
                if (Array.isArray(pubItems)) {
                  const picItem = pubItems.find(f => f && f.name === 'sidebar_picture.png' && f.download_url);
                  if (picItem) {
                    setBio(prev => ({ ...prev, avatarUrl: `${picItem.download_url}?sha=${picItem.sha || cacheBuster}` }));
                  }
                }
              }
            } catch (e) {}
          }
        }

        return syncSource;
      }

      async function fetchLatestRepoCommit(targetRepo) {
        const repoSlug = normalizeRepoSlug(targetRepo || bio.logsRepo);
        if (!repoSlug || !repoSlug.includes('/')) return null;
        try {
          const res = await fetch(`https://api.github.com/repos/${repoSlug}/commits?sha=main&per_page=1&_t=${Date.now()}`, {
            headers: { 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          });
          if (res.ok) {
            const cList = await res.json();
            if (Array.isArray(cList) && cList.length > 0) {
              const c = cList[0];
              return {
                sha: c.sha ? c.sha.slice(0, 7) : '',
                fullSha: c.sha || '',
                message: c.commit && c.commit.message ? c.commit.message.split('\n')[0] : 'commit',
                date: c.commit && c.commit.author && c.commit.author.date ? c.commit.author.date.split('T')[0] : ''
              };
            }
          }
        } catch (e) {}
        return null;
      }

      async function loadLogsFromGit(targetRepo, targetFolder) {
        const repoSlug = normalizeRepoSlug(targetRepo || bio.logsRepo);
        const folderPath = (targetFolder || bio.logsPath || 'logs').trim().replace(/^\/+|\/+$/g, '');
        const loadedPosts = [];
        const seenNames = new Set();
        const cacheBuster = Date.now();
        let loadedFromGitHub = false;

        async function loadLocalBundledLogs(markAsGitHub = false) {
          try {
            const idxRes = await fetch(`./logs/index.json?t=${cacheBuster}`, { cache: 'no-store' });
            if (idxRes.ok) {
              const fileList = await idxRes.json();
              if (Array.isArray(fileList)) {
                for (const fileName of fileList) {
                  if (!seenNames.has(fileName)) {
                    try {
                      const mdRes = await fetch(`./logs/${fileName}?t=${cacheBuster}`, { cache: 'no-store' });
                      if (mdRes.ok) {
                        const rawText = await mdRes.text();
                        const parsed = parseMarkdownWithFrontmatter(rawText, fileName);
                        seenNames.add(fileName);
                        if (markAsGitHub) loadedFromGitHub = true;
                        loadedPosts.push({
                          id: `local-md-${fileName}`,
                          title: parsed.title,
                          date: parsed.date,
                          tags: parsed.tags,
                          source: `${repoSlug}/public/logs/${fileName}`,
                          summary: parsed.summary,
                          content: parsed.content
                        });
                      }
                    } catch (e) {}
                  }
                }
              }
            }
          } catch (e) {}
        }

        if (isGitHubPagesHost()) {
          await loadLocalBundledLogs(true);
        }

        if (loadedPosts.length === 0 && repoSlug && repoSlug.includes('/')) {
          const candidatePaths = [`public/${folderPath}`, folderPath];
          for (const cPath of candidatePaths) {
            try {
              const url = `https://api.github.com/repos/${repoSlug}/contents/${cPath}?ref=main&_t=${cacheBuster}`;
              const res = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github.v3+json' },
                cache: 'no-store'
              });
              if (res.ok) {
                const items = await res.json();
                if (Array.isArray(items)) {
                  const mdFiles = items.filter(f => f.type === 'file' && /\.(md|markdown|txt)$/i.test(f.name));
                  for (const fileItem of mdFiles.slice(0, 30)) {
                    if (!seenNames.has(fileItem.name)) {
                      const rawText = await fetchGitHubFileText(repoSlug, fileItem.path, 'main', fileItem.sha);
                      if (rawText) {
                        const parsed = parseMarkdownWithFrontmatter(rawText, fileItem.name);
                        seenNames.add(fileItem.name);
                        loadedFromGitHub = true;
                        loadedPosts.push({
                          id: 'gh-md-' + (fileItem.sha || fileItem.name),
                          title: parsed.title,
                          date: parsed.date,
                          tags: parsed.tags,
                          source: `${repoSlug}/${fileItem.path}`,
                          summary: parsed.summary,
                          content: parsed.content
                        });
                      }
                    }
                  }
                }
                if (loadedPosts.length > 0) break;
              }
            } catch (e) {}
          }
        }

        if (loadedPosts.length === 0) {
          await loadLocalBundledLogs(false);
        }

        if (loadedPosts.length > 0) {
          loadedPosts.sort((a, b) => String(b.date).localeCompare(String(a.date)));
          setPosts(loadedPosts);
        }
        return { count: loadedPosts.length, fromGitHub: loadedFromGitHub };
      }

      async function fetchLiveGitActivity() {
        const user = (bio.githubUser || 'xarop-pa-toss').trim();
        try {
          const [eventsRes, reposRes] = await Promise.all([
            fetch(`https://api.github.com/users/${encodeURIComponent(user)}/events/public?per_page=30`),
            fetch(`https://api.github.com/users/${encodeURIComponent(user)}/repos?sort=updated&per_page=12`)
          ]);

          const mergedCommits = [];
          const seenShas = new Set();

          if (eventsRes.ok) {
            const eventsData = await eventsRes.json();
            if (Array.isArray(eventsData)) {
              eventsData.forEach(ev => {
                if (ev.type === 'PushEvent' && ev.payload && Array.isArray(ev.payload.commits)) {
                  const branchName = String(ev.payload.ref || 'refs/heads/main').replace('refs/heads/', '');
                  ev.payload.commits.slice().reverse().forEach(c => {
                    if (c.sha && !seenShas.has(c.sha)) {
                      seenShas.add(c.sha);
                      mergedCommits.push({
                        id: c.sha,
                        source: 'GitHub',
                        repo: ev.repo ? ev.repo.name : user,
                        branch: branchName,
                        hash: String(c.sha || '').slice(0, 7),
                        message: String(c.message || '').split('\n')[0],
                        date: ev.created_at ? ev.created_at.split('T')[0] : ''
                      });
                    }
                  });
                }
              });
            }
          }

          if (reposRes.ok) {
            const reposData = await reposRes.json();
            if (Array.isArray(reposData)) {
              setGithubRepos(reposData);
              for (const r of reposData.filter(repo => repo && Number(repo.size) > 0).slice(0, 3)) {
                try {
                  const cRes = await fetch(`https://api.github.com/repos/${r.full_name}/commits?per_page=2`);
                  if (cRes.ok) {
                    const cList = await cRes.json();
                    if (Array.isArray(cList)) {
                      cList.forEach(item => {
                        if (item.sha && !seenShas.has(item.sha)) {
                          seenShas.add(item.sha);
                          mergedCommits.push({
                            id: item.sha,
                            source: 'GitHub',
                            repo: r.full_name,
                            branch: r.default_branch || 'main',
                            hash: String(item.sha || '').slice(0, 7),
                            message: item.commit && item.commit.message ? item.commit.message.split('\n')[0] : 'commit',
                            date: item.commit && item.commit.author && item.commit.author.date ? item.commit.author.date.split('T')[0] : ''
                          });
                        }
                      });
                    }
                  }
                } catch (e) {}
              }
            }
          }

          if (mergedCommits.length > 0) {
            setGithubCommits(mergedCommits.slice(0, 10));
          }
        } catch (err) {}

        if (bio.giteaBaseUrl && bio.giteaBaseUrl.trim()) {
          try {
            const base = bio.giteaBaseUrl.trim().replace(/\/+$/, '');
            const gUser = (bio.giteaUser || 'xarop_pa_toss').trim();
            const res = await fetch(`${base}/api/v1/users/${encodeURIComponent(gUser)}/repos?limit=5`);
            if (res.ok) {
              const gRepos = await res.json();
              if (Array.isArray(gRepos) && gRepos.length > 0) {
                const topRepo = gRepos[0];
                const cRes = await fetch(`${base}/api/v1/repos/${topRepo.full_name}/commits?limit=3`);
                if (cRes.ok) {
                  const cData = await cRes.json();
                  if (Array.isArray(cData)) {
                    setGiteaCommits(cData.map(item => ({
                      id: item.sha,
                      source: 'Gitea',
                      repo: topRepo.full_name,
                      branch: topRepo.default_branch || 'main',
                      hash: String(item.sha || '').slice(0, 7),
                      message: item.commit && item.commit.message ? item.commit.message.split('\n')[0] : 'commit',
                      date: item.created ? item.created.split('T')[0] : ''
                    })));
                  }
                }
              }
            }
          } catch (e) {}
        }
      }

      async function triggerGitOpsSync() {
        setGitOpsSync(prev => ({ ...prev, status: 'syncing' }));
        setGitSyncStatus('Syncing from GitHub...');

        const repoSlug = normalizeRepoSlug(bio.logsRepo);

        const [stateSource, commitInfo, logResult] = await Promise.all([
          loadCanonicalStateJson(repoSlug),
          fetchLatestRepoCommit(repoSlug),
          loadLogsFromGit(repoSlug, bio.logsPath || 'logs'),
          fetchLiveGitActivity()
        ]);

        const effectiveSource = (stateSource === 'github' || (logResult && logResult.fromGitHub)) ? 'github' : 'local';
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        setGitOpsSync({
          status: effectiveSource === 'github' ? 'synced' : 'fallback',
          source: effectiveSource,
          repo: repoSlug,
          branch: 'main',
          lastCommitSha: commitInfo ? commitInfo.sha : '',
          lastCommitMsg: commitInfo ? commitInfo.message : '',
          lastCommitDate: commitInfo ? commitInfo.date : '',
          lastSyncedAt: timeStr,
          logCount: (logResult && logResult.count) || 0
        });

        setGitSyncStatus(`Synced at ${timeStr}`);
      }

        let lastSyncTimestamp = Date.now();
        const AUTO_SYNC_INTERVAL_MS = 180000; // 3 minutes (stays within GitHub public API 60 req/hr limit)

        triggerGitOpsSync();

        const intervalId = setInterval(() => {
          if (typeof document === 'undefined' || document.visibilityState === 'visible') {
            lastSyncTimestamp = Date.now();
            triggerGitOpsSync();
          }
        }, AUTO_SYNC_INTERVAL_MS);

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible' && Date.now() - lastSyncTimestamp >= AUTO_SYNC_INTERVAL_MS) {
            lastSyncTimestamp = Date.now();
            triggerGitOpsSync();
          }
        };

        if (typeof document !== 'undefined') {
          document.addEventListener('visibilitychange', handleVisibilityChange);
        }

        return () => {

          )
        ) : null,

        roadmapSubTab === 'assessments' ? h('div', { className: 'os-window', style: { overflowX: 'auto', padding: '1rem' } },
          h('table', null,
            h('thead', null,
              h('tr', { style: { borderBottom: '2px solid #4A2552' } },
                h('th', { className: 'font-mono', style: { padding: '0.6rem', textAlign: 'left', fontSize: '11.5px', color: '#4A2552' } }, 'Skill'),
                ...T_GATES.map(g =>
                  h('th', { key: g.id, className: 'font-mono', style: { padding: '0.6rem', textAlign: 'center', fontSize: '11.5px' } },
                    h('div', { style: { color: '#4A2552' } }, g.name),
                    h('div', { style: { fontSize: '10px', color: '#49585E', fontWeight: 400 } }, g.desc)
                  )
                )
              )
            ),
            h('tbody', null,
              ...ASSESSMENTS.map(skill =>
                h('tr', { key: skill.id, style: { borderBottom: '1px solid rgba(42, 120, 134, 0.22)' } },
                  h('td', { style: { padding: '0.6rem', fontWeight: 600, fontSize: '0.86rem' } }, skill.name),
                  ...T_GATES.map(gate => {
                    const key = `${skill.id}_${gate.id}`;
                    const val = assessments[key] || STATUS.PENDING;
                    return h('td', { key, style: { padding: '0.45rem', textAlign: 'center' } },
                      h(StatusBadge, { status: val })
                    );
                  })
                )
              )
            )
          )
        ) : null,

        roadmapSubTab === 'branches' ? h('div', { className: 'grid-3' },
          ...BRANCHES.map(b =>
            h('div', {
              key: b.id,
              className: 'os-window',
              style: {
                padding: '1.25rem',
                display: 'flex',
                flexDirection: 'column',
                justifyContent: 'space-between',
                gap: '0.85rem'
              }
            },
              h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.45rem' } },
                h('div', { className: 'font-mono', style: { fontSize: '11px', color: '#2A7886', fontWeight: 600 } }, b.type),
                h('h3', { className: 'font-display', style: { fontSize: '1.15rem', fontWeight: 700, color: '#4A2552' } }, b.name),
                h('p', { style: { fontSize: '0.86rem', color: '#1E1721' } }, b.target),
                h('p', { style: { fontSize: '0.82rem', color: '#49585E' } }, b.core)
              ),
              h('div', {
                className: 'font-mono',
                style: {
                  padding: '0.4rem 0.7rem',
                  textAlign: 'center',
                  fontSize: '11.5px',
                  fontWeight: 600,
                  backgroundColor: branch === b.id ? '#4A2552' : '#EDF3F5',
                  color: branch === b.id ? '#FFFFFF' : '#49585E',
                  border: '1px solid #4A2552'
                }
              }, branch === b.id ? 'Active Branch' : 'Candidate')
            )
          )
        ) : null,

        roadmapSubTab === 'portfolio' ? h('div', { style: { display: 'flex', flexDirection: 'column', gap: '1.15rem' } },
          ...PORTFOLIO_PROJECTS.map(proj => {
            const repoLink = portfolio[`${proj.id}_link`];
            return h('div', { key: proj.id, className: 'os-window', style: { padding: '1.25rem', display: 'flex', flexDirection: 'column', gap: '0.85rem' } },
              h('div', { style: { display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '0.75rem' } },
                h('div', null,
                  h('h3', { className: 'font-display', style: { fontSize: '1.15rem', fontWeight: 700, color: '#4A2552' } }, proj.name),
                  h('p', { style: { fontSize: '12px', color: '#49585E' } }, proj.proof)
                ),
                repoLink
                  ? h('a', { href: repoLink, target: '_blank', rel: 'noreferrer', className: 'os-btn os-btn-primary' }, 'Repo ↗')
                  : h('span', { className: 'font-mono', style: { fontSize: '11.5px', color: '#49585E' } }, 'In Progress')
              ),
              h('div', { className: 'grid-6' },
                ...SIGNALS.map(sig => {
                  const k = `${proj.id}_${sig.id}`;
                  const active = Boolean(portfolio[k]);
                  return h('div', {
                    key: k,
                    className: 'os-panel',
                    style: {
                      padding: '0.55rem 0.65rem',
                      backgroundColor: active ? 'rgba(121, 186, 193, 0.3)' : '#EDF3F5'
                    }
                  },
                    h('div', { className: 'font-mono', style: { fontSize: '11px', fontWeight: 600, color: '#4A2552' } }, sig.name),
                    h('div', { style: { fontSize: '10.5px', color: '#49585E' } }, sig.channel)
                  );
                })
              )
            );
          })
        ) : null,

        roadmapSubTab === 'applications' ? h('div', { className: 'os-window', style: { padding: '1rem', overflowX: 'auto' } },
          h('table', null,
            h('thead', null,
              h('tr', { style: { borderBottom: '2px solid #4A2552' } },
                h('th', { className: 'font-mono', style: { padding: '0.6rem', textAlign: 'left', fontSize: '11.5px', color: '#4A2552' } }, 'Cohort'),
                h('th', { className: 'font-mono', style: { padding: '0.6rem', textAlign: 'left', fontSize: '11.5px', color: '#4A2552' } }, 'Target'),
                h('th', { className: 'font-mono', style: { padding: '0.6rem', textAlign: 'center', fontSize: '11.5px', color: '#4A2552' } }, 'Applied'),
                h('th', { className: 'font-mono', style: { padding: '0.6rem', textAlign: 'center', fontSize: '11.5px', color: '#4A2552' } }, 'Screens'),
                h('th', { className: 'font-mono', style: { padding: '0.6rem', textAlign: 'center', fontSize: '11.5px', color: '#4A2552' } }, 'Tech')
              )
            ),
            h('tbody', null,
              ...COHORTS.map(c =>
                h('tr', { key: c.id, style: { borderBottom: '1px solid rgba(42, 120, 134, 0.22)' } },
                  h('td', { style: { padding: '0.65rem' } },
                    h('div', { style: { fontWeight: 600, fontSize: '0.88rem', color: '#4A2552' } }, c.name),
                    h('div', { style: { fontSize: '11.5px', color: '#49585E' } }, c.titles)
                  ),
                  h('td', { className: 'font-mono', style: { padding: '0.65rem', fontSize: '12px', color: '#49585E' } }, `~${c.target}`),
                  ...['applied', 'screens', 'tech'].map(field =>
                    h('td', { key: field, style: { padding: '0.65rem', textAlign: 'center' } },
                      h('span', { className: 'font-mono tabular-nums', style: { fontWeight: 600, fontSize: '0.92rem', color: '#4A2552' } },
                        String((applications[c.id] && applications[c.id][field]) || 0)
                      )
                    )
                  )
                )
              )
            )
          )
        ) : null
      );

      // --- SECTION 4: OTHER STUFF (CONCISE ARCHITECTURE & PUBLIC REPOS) ---
      const renderProjectsAndRepos = () => h('div', { style: { display: 'flex', flexDirection: 'column', gap: '1.35rem' } },
        h('section', { className: 'os-window' },
          h('div', { className: 'os-titlebar' },
            h('span', null, 'Flaggo 4-App Architecture'),
            h('span', null, 'Control Plane · Data Plane · PostgreSQL')
          ),
          h('div', { style: { padding: '1.35rem', display: 'flex', flexDirection: 'column', gap: '1rem' } },
            h('p', { style: { fontSize: '0.9rem', color: '#1E1721', maxWidth: '70ch' } },
              'Flaggo decouples code deployment from feature release using a centralized Control Plane and in-memory Data Plane evaluators.'
            ),
            h('div', { className: 'grid-2' },
              h('div', { className: 'os-panel', style: { padding: '0.95rem' } },
                h('div', { className: 'font-mono', style: { fontSize: '11.5px', color: '#4A2552', fontWeight: 600 } }, '01. Control Plane Frontend'),
                h('p', { style: { fontSize: '0.84rem', color: '#49585E', marginTop: '0.25rem' } },
                  'Dashboard for boolean flags, percentage rollouts, and kill switches.'
                )
              ),
              h('div', { className: 'os-panel', style: { padding: '0.95rem' } },
                h('div', { className: 'font-mono', style: { fontSize: '11.5px', color: '#2A7886', fontWeight: 600 } }, '02. Control Plane Web API'),
                h('p', { style: { fontSize: '0.84rem', color: '#49585E', marginTop: '0.25rem' } },
                  'REST & SSE service managing flag rules, environment isolation, and health probes.'
                )
              ),
              h('div', { className: 'os-panel', style: { padding: '0.95rem' } },
                h('div', { className: 'font-mono', style: { fontSize: '11.5px', color: '#4A2552', fontWeight: 600 } }, '03. Data Plane Evaluator'),
                h('p', { style: { fontSize: '0.84rem', color: '#49585E', marginTop: '0.25rem' } },
                  'Evaluates feature rules dynamically in memory with zero process restarts.'
                )
              ),
              h('div', { className: 'os-panel', style: { padding: '0.95rem' } },
                h('div', { className: 'font-mono', style: { fontSize: '11.5px', color: '#2A7886', fontWeight: 600 } }, '04. PostgreSQL Store'),
                h('p', { style: { fontSize: '0.84rem', color: '#49585E', marginTop: '0.25rem' } },
                  'Private Single-AZ PostgreSQL instance storing flag definitions and audit logs.'
                )
              )
            )
          )
        ),

        h('section', { className: 'os-window' },
          h('div', { className: 'os-titlebar os-titlebar-teal' },
            h('span', null, 'Public Git Repositories'),
            h('button', { type: 'button', onClick: fetchLiveGitActivity, style: { color: '#FFFFFF', textDecoration: 'underline' } }, 'Refresh')
          ),
          h('div', { style: { padding: '1.35rem' } },
            githubRepos.length === 0
              ? h('p', { className: 'font-mono', style: { fontSize: '0.85rem', color: '#49585E' } },
                  gitSyncStatus || `Loading repositories from github.com/${bio.githubUser}...`
                )
              : h('div', { className: 'grid-2' },
                  ...githubRepos.map(repo =>
                    h('a', {
                      key: repo.id,
                      href: repo.html_url,
                      target: '_blank',
                      rel: 'noreferrer',
                      className: 'os-panel',
                      style: { padding: '1rem', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', gap: '0.55rem' }
                    },
                      h('div', null,
                        h('div', { className: 'font-mono', style: { fontSize: '12.5px', fontWeight: 600, color: '#4A2552' } }, repo.name),
                        h('p', { style: { fontSize: '0.84rem', color: '#1E1721', marginTop: '0.25rem' } }, repo.description || 'Public repository on GitHub.')
                      ),
                      h('div', { className: 'font-mono', style: { fontSize: '11px', color: '#2A7886' } },
                        `${repo.language || 'Repo'} · Updated ${String(repo.updated_at || '').split('T')[0]} ↗`
                      )
                    )
                  )
                )
          )
        )
      );

      const tickerItems = useMemo(() => {
        const items = [];
        if (githubCommits.length > 0) {
          githubCommits.forEach(c => {
            items.push(`[GITHUB] ${c.repo}@${c.branch} (${c.hash}) — ${c.message} (${c.date})`);
          });
        } else {
          items.push(`[GITHUB] github.com/${bio.githubUser} — ${gitSyncStatus || 'Polling public events API...'}`);
        }

        if (giteaCommits.length > 0) {
          giteaCommits.forEach(c => {
            items.push(`[GITEA] ${c.repo}@${c.branch} (${c.hash}) — ${c.message} (${c.date})`);
          });
        }
        return items;
      }, [githubCommits, giteaCommits, bio.githubUser, gitSyncStatus]);

      return h('div', { style: { minHeight: '100vh', display: 'flex', flexDirection: 'column' } },
        // --- 3-ZONE HIGH-CONTRAST TOP BAR ---
        h('header', { className: 'top-bar' },
          h('button', {
            type: 'button',
            onClick: () => setMainSection('logs'),
            className: 'font-display',
            style: { fontSize: '1.22rem', lineHeight: 1.15, fontWeight: 700, color: '#FFFFFF', whiteSpace: 'nowrap', flexShrink: 0, justifySelf: 'start', letterSpacing: '0.01em' }
          },
            h('span', null, 'xarop'),
            h('span', { style: { color: '#79BAC1' } }, '.link')
          ),

          h('nav', { className: 'nav-links', ariaLabel: 'Main Navigation' },
            ...uiConfig.navItems.map(item =>
              h('button', {
                key: item.id,
                type: 'button',
                onClick: () => setMainSection(item.id),
                className: `nav-link ${mainSection === item.id ? 'nav-link-active' : ''}`
              }, item.label)
            )
          ),

          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'flex-end', justifySelf: 'end', gap: '0.6rem', flexShrink: 0 } },
            h('button', {
              type: 'button',
              onClick: () => triggerGitOpsSync(),
              title: `Auto-syncs every 3m · Click to sync now from ${gitOpsSync.repo}`,
              className: 'os-btn os-btn-teal tabular-nums',
              style: { fontSize: '11px', padding: '0.3rem 0.5rem', width: '142px', justifyContent: 'center', whiteSpace: 'nowrap' }
            },
              gitOpsSync.status === 'syncing'
                ? 'Syncing...'
                : (gitOpsSync.lastCommitSha ? `Sync @${gitOpsSync.lastCommitSha} ↻` : 'Sync Git ↻')
            )
          )
        ),

        // --- 2-COLUMN WORKSPACE: LEFT PROFILE SIDEBAR + MAIN CONTENT ---
        h('main', { className: 'shell-container', style: { flex: 1, width: '100%' } },
          h('div', { className: 'workspace-layout' },
            renderProfileSidebar(),
            h('div', { style: { minWidth: 0 } },
              mainSection === 'logs' ? renderHomeLogs() :
              mainSection === 'roadmap' ? renderRoadmapSection() :
              mainSection === 'operation' ? renderOperationFlaggo() :
              renderProjectsAndRepos()
            )
          )
        ),

        // --- LOG READER MODAL ---
        readingPost ? h('div', {
          className: 'modal-backdrop',
          role: 'dialog',
          ariaModal: 'true',
          ariaLabel: readingPost.title,
          onClick: (e) => { if (e.target === e.currentTarget) setReadingPost(null); }
        },
          h('div', {
            className: 'os-window',
            style: { width: '95vw', maxWidth: '920px', maxHeight: '88vh', display: 'flex', flexDirection: 'column' }
          },
            h('div', { className: 'os-titlebar os-titlebar-teal' },
              h('span', null, `${readingPost.date} · ${(readingPost.tags || []).map(t => '#' + t).join(' · ')}`),
              h('button', { type: 'button', onClick: () => setReadingPost(null), style: { color: '#FFFFFF', fontWeight: 700 } }, '[X]')
            ),
            h('div', { style: { padding: '1.75rem 2rem', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '1.15rem' } },
              h('div', { style: { paddingBottom: '0.75rem', borderBottom: '1.5px solid #4A2552' } },
                h('h2', { className: 'font-display', style: { fontSize: '1.65rem', fontWeight: 700, color: '#4A2552', lineHeight: 1.2 } }, readingPost.title),
                readingPost.source ? h('div', { className: 'font-mono', style: { fontSize: '11px', color: '#49585E', marginTop: '0.25rem' } }, `Source: ${readingPost.source}`) : null
              ),
              h(MarkdownRenderer, { content: readingPost.content }),
              h('div', { style: { display: 'flex', justifyContent: 'flex-end', paddingTop: '1rem', borderTop: '1px solid rgba(42, 120, 134, 0.3)' } },
                h('button', { type: 'button', onClick: () => setReadingPost(null), className: 'os-btn os-btn-primary' }, 'Close')
              )
            )
          )
        ) : null,

        // --- PERSISTENT BOTTOM SCROLLING BAR (LIVE GITHUB + GITEA STREAM) ---
        h('footer', { className: 'commit-ticker-bar', ariaLabel: 'Latest GitHub and Gitea Commits' },
          h('div', { className: 'commit-ticker-label' }, 'GIT STREAM'),
          h('div', { className: 'commit-ticker-viewport' },
            h('div', { className: 'commit-ticker-track' },
              ...[...tickerItems, ...tickerItems].map((text, idx) =>
                h('span', {
                  key: idx,
                  style: { display: 'inline-flex', alignItems: 'center', padding: '0 2rem', whiteSpace: 'nowrap' }
                }, text)
              )
            )
          ),
          h('div', { style: { display: 'flex', height: '100%', flexShrink: 0 } },
            h('button', {
              type: 'button',
              onClick: () => triggerGitOpsSync(),
              className: 'tabular-nums',
              style: {
                height: '100%',
                width: '112px',
                padding: '0 0.5rem',
                fontSize: '0.66rem',
                backgroundColor: '#2A7886',
                color: '#FFFFFF',
                borderLeft: '1.5px solid #241529',
                display: 'inline-flex',
                alignItems: 'center',
                justifyContent: 'center',
                gap: '0.35rem',
                whiteSpace: 'nowrap',
                cursor: 'pointer'
              },
              title: 'Refresh live commit stream'
            }, gitOpsSync.status === 'syncing' ? 'SYNCING...' : (gitOpsSync.lastCommitSha ? `HEAD @${gitOpsSync.lastCommitSha}` : 'SYNC')),
            h('a', {
              href: bio.githubUrl,
              target: '_blank',
              rel: 'noreferrer',
              style: {
                height: '100%',
                padding: '0 0.7rem',
                fontSize: '0.66rem',
                backgroundColor: '#79BAC1',
                color: '#241529',
                fontWeight: 600,
                borderLeft: '1.5px solid #241529',
                display: 'inline-flex',
                alignItems: 'center',
                whiteSpace: 'nowrap'
              }
            }, '@xarop-pa-toss ↗')
          )
        )
      );
    }

    async function mountXaropLinkApp() {
      if (!window.__LZ_REMOTE_ACTIVE__) {
        const bootedFromRemote = await bootFromGitHubIndexHtml(DEFAULT_REPO_SLUG, 'main');
        if (bootedFromRemote) {
          return;
        }
      }
      const rootEl = document.getElementById('root');
      if (rootEl) {
        if (!window.__LZ_REACT_ROOT__) {
          window.__LZ_REACT_ROOT__ = ReactDOM.createRoot(rootEl);
        }
        window.__LZ_REACT_ROOT__.render(React.createElement(App));
      }
    }

    mountXaropLinkApp();
  </script>
</body>
</html>
