    // --- MARKDOWN FRONTMATTER PARSER & RENDERER FOR REAL GIT REPO POSTS ---
    function parseMarkdownWithFrontmatter(rawText, fallbackName) {
      const trimmed = String(rawText || '').replace(/\r\n/g, '\n').trim();
      const result = {
        title: String(fallbackName || 'Untitled Log').replace(/\.(md|txt)$/i, '').replace(/[-_]/g, ' '),
        date: new Date().toISOString().split('T')[0],
        tags: ['log'],
        summary: '',
        content: trimmed
      };

      if (trimmed.startsWith('---')) {
        const endMatch = trimmed.slice(3).match(/\n---\s*(\n|$)/);
        if (endMatch) {
          const endIdx = 3 + endMatch.index;
          const fmBlock = trimmed.slice(3, endIdx).trim();
          const body = trimmed.slice(endIdx + endMatch[0].length).trim();
          result.content = body;
          fmBlock.split('\n').forEach(line => {
            const colon = line.indexOf(':');
            if (colon > 0) {
              const key = line.slice(0, colon).trim().toLowerCase();
              const val = line.slice(colon + 1).trim().replace(/^["']|["']$/g, '');
              if (key === 'title' && val) result.title = val;
              if (key === 'date' && val) result.date = val;
              if (key === 'summary' && val) result.summary = val;
              if (key === 'tags' && val) {
                const cleaned = val.replace(/^\[|\]$/g, '');
                result.tags = cleaned.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
              }
            }
          });
        }
      }

      if (!result.summary) {
        const firstPara = result.content.split('\n\n').find(p => p.trim() && !p.trim().startsWith('#')) || result.content;
        result.summary = firstPara.replace(/[#*`]/g, '').trim().slice(0, 180);
      }
      return result;
    }

    function buildMarkdownFileContent(post) {
      return `---\ntitle: "${post.title.replace(/"/g, '\\"')}"\ndate: "${post.date}"\ntags: [${(post.tags || []).join(', ')}]\nsummary: "${post.summary.replace(/"/g, '\\"')}"\n---\n\n${post.content}\n`;
    }

    function renderInlineMarkdown(text, keyPrefix = 'inl') {
      if (!text) return null;
      const str = String(text);
      const tokenRegex = /(!\[([^\]]*)\]\(([^)]+)\))|(\[([^\]]+)\]\(([^)]+)\))|(`([^`]+)`)|(\*\*\*([^*]+)\*\*\*)|(\*\*([^*]+)\*\*)|(__([^_]+)__)|(\*([^*]+)\*)|(_([^_]+)_)/g;
      const nodes = [];
      let lastIndex = 0;
      let match;
      let idx = 0;

      while ((match = tokenRegex.exec(str)) !== null) {
        if (match.index > lastIndex) {
          nodes.push(str.slice(lastIndex, match.index));
        }
        const key = `${keyPrefix}-${idx++}`;
        if (match[1]) {
          // Image: ![alt](url)
          nodes.push(h('img', {
            key,
            src: match[3],
            alt: match[2] || '',
            style: {
              maxWidth: '100%',
              height: 'auto',
              border: '1.5px solid #2A7886',
              boxShadow: '3px 3px 0px rgba(81, 43, 88, 0.16)',
              margin: '0.65rem 0',
              display: 'block'
            }
          }));
        } else if (match[4]) {
          // Link: [label](url)
          nodes.push(h('a', {
            key,
            href: match[6],
            target: '_blank',
            rel: 'noreferrer',
            style: {
              color: '#2A7886',
              fontWeight: 600,
              textDecoration: 'underline',
              textUnderlineOffset: '3px'
            }
          }, match[5]));
        } else if (match[7]) {
          // Inline code: `code`
          nodes.push(h('code', {
            key,
            className: 'font-mono',
            style: {
              backgroundColor: '#E6ECEE',
              color: '#512B58',
              padding: '0.12rem 0.42rem',
              fontSize: '0.88em',
              border: '1px solid rgba(42, 120, 134, 0.35)',
              fontWeight: 500
            }
          }, match[8]));
        } else if (match[9]) {
          // Bold + Italic: ***text***
          nodes.push(h('strong', { key, style: { fontWeight: 700, fontStyle: 'italic', color: '#512B58' } }, match[10]));
        } else if (match[11] || match[13]) {
          // Bold: **text** or __text__
          nodes.push(h('strong', { key, style: { fontWeight: 700, color: '#512B58' } }, match[12] || match[14]));
        } else if (match[15] || match[17]) {
          // Italic: *text* or _text_
          nodes.push(h('em', { key, style: { fontStyle: 'italic' } }, match[16] || match[18]));
        }
        lastIndex = tokenRegex.lastIndex;
      }

      if (lastIndex < str.length) {
        nodes.push(str.slice(lastIndex));
      }
      return nodes.length === 1 && typeof nodes[0] === 'string' ? nodes[0] : nodes;
    }

    function MarkdownRenderer({ content }) {
      const normalized = String(content || '').replace(/\r\n/g, '\n');
      const lines = normalized.split('\n');
      const blocks = [];
      let i = 0;

      const isBlockStarter = (line) => {
        const t = line.trim();
        if (!t) return true;
        if (t.startsWith('```')) return true;
        if (/^(---|___|\*\*\*)\s*$/.test(t)) return true;
        if (/^#{1,6}\s+/.test(t)) return true;
        if (t.startsWith('>')) return true;
        if (/^\s*[-*+]\s+/.test(line)) return true;
        if (/^\s*\d+\.\s+/.test(line)) return true;
        return false;
      };

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        // 1. Blank line
        if (!trimmed) {
          i++;
          continue;
        }

        // 2. Fenced Code Block (```lang ... ```)
        if (trimmed.startsWith('```')) {
          const lang = trimmed.slice(3).trim() || 'code';
          i++;
          const codeLines = [];
          while (i < lines.length && !lines[i].trim().startsWith('```')) {
            codeLines.push(lines[i]);
            i++;
          }
          if (i < lines.length && lines[i].trim().startsWith('```')) {
            i++;
          }
          blocks.push(
            h('div', {
              key: `md-code-${blocks.length}`,
              style: {
                border: '1.5px solid #2A7886',
                backgroundColor: '#231926',
                color: '#F1F3F4',
                boxShadow: '3px 3px 0px rgba(81, 43, 88, 0.16)',
                margin: '0.35rem 0'
              }
            },
              h('div', {
                className: 'font-mono',
                style: {
                  backgroundColor: '#512B58',
                  color: '#F1F3F4',
                  padding: '0.35rem 0.9rem',
                  fontSize: '11px',
                  fontWeight: 600,
                  borderBottom: '1px solid #2A7886',
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center'
                }
              },
                h('span', null, lang.toUpperCase()),
                h('span', { style: { color: '#79BAC1', fontSize: '10.5px' } }, 'MARKDOWN CODE BLOCK')
              ),
              h('pre', {
                className: 'font-mono',
                style: {
                  margin: 0,
                  padding: '1.1rem 1.25rem',
                  fontSize: '0.88rem',
                  lineHeight: 1.65,
                  overflowX: 'auto',
                  color: '#F1F3F4',
                  whiteSpace: 'pre'
                }
              }, h('code', null, codeLines.join('\n')))
            )
          );
          continue;
        }

        // 3. Horizontal Rule (---, ___, ***)
        if (/^(---|___|\*\*\*)\s*$/.test(trimmed)) {
          blocks.push(
            h('hr', {
              key: `md-hr-${blocks.length}`,
              style: {
                border: 0,
                borderTop: '2px solid rgba(42, 120, 134, 0.45)',
                margin: '0.75rem 0'
              }
            })
          );
          i++;
          continue;
        }

        // 4. Headings (# through ######)
        const headingMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
          const level = headingMatch[1].length;
          const text = headingMatch[2];
          const fontSizes = { 1: '1.55rem', 2: '1.35rem', 3: '1.18rem', 4: '1.05rem', 5: '0.98rem', 6: '0.92rem' };
          const tag = `h${Math.min(level + 1, 6)}`;
          blocks.push(
            h(tag, {
              key: `md-h-${blocks.length}`,
              className: 'font-display',
              style: {
                fontSize: fontSizes[level] || '1.1rem',
                fontWeight: 700,
                color: level <= 2 ? '#512B58' : '#2A7886',
                marginTop: '0.5rem',
                marginBottom: '0.15rem',
                paddingBottom: level <= 2 ? '0.35rem' : 0,
                borderBottom: level <= 2 ? '1px solid rgba(42, 120, 134, 0.3)' : 'none'
              }
            }, renderInlineMarkdown(text, `h-${blocks.length}`))
          );
          i++;
          continue;
        }

        // 5. Blockquote (> ...)
        if (trimmed.startsWith('>')) {
          const quoteLines = [];
          while (i < lines.length && lines[i].trim().startsWith('>')) {
            quoteLines.push(lines[i].trim().replace(/^>\s?/, ''));
            i++;
          }
          blocks.push(
            h('blockquote', {
              key: `md-q-${blocks.length}`,
              className: 'os-panel',
              style: {
                margin: '0.25rem 0',
                padding: '0.9rem 1.25rem',
                borderLeft: '5px solid #2A7886',
                backgroundColor: '#F1F3F4',
                color: '#231926',
                fontSize: '0.96rem',
                lineHeight: 1.7
              }
            }, renderInlineMarkdown(quoteLines.join(' '), `q-${blocks.length}`))
          );
          continue;
        }

        // 6. Unordered List (- / * / +)
        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*+]\s+/, ''));
            i++;
          }
          blocks.push(
            h('ul', {
              key: `md-ul-${blocks.length}`,
              style: {
                margin: '0.25rem 0',
                paddingLeft: '1.5rem',
                display: 'flex',
                flexDirection: 'column',
                gap: '0.45rem',
                listStyleType: 'square',
                color: '#231926',
                fontSize: '1rem',
                lineHeight: 1.7
              }
            }, items.map((item, idx) =>
              h('li', { key: idx }, renderInlineMarkdown(item, `ul-${blocks.length}-${idx}`))
            ))
          );
          continue;
        }

        // 7. Ordered List (1. 2. ...)
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
            i++;
          }
          blocks.push(
            h('ol', {
              key: `md-ol-${blocks.length}`,
              style: {
                margin: '0.25rem 0',
                paddingLeft: '1.5rem',
                display: 'flex',
                flexDirection: 'column',
                gap: '0.45rem',
                listStyleType: 'decimal',
                color: '#231926',
                fontSize: '1rem',
                lineHeight: 1.7
              }
            }, items.map((item, idx) =>
              h('li', { key: idx }, renderInlineMarkdown(item, `ol-${blocks.length}-${idx}`))
            ))
          );
          continue;
        }

        // 8. Standard Paragraph (preserves explicit single line breaks as <br/>)
        const paraLines = [];
        while (i < lines.length && !isBlockStarter(lines[i])) {
          paraLines.push(lines[i]);
          i++;
        }
        if (paraLines.length > 0) {
          const paraChildren = [];
          paraLines.forEach((pLine, pIdx) => {
            if (pIdx > 0) paraChildren.push(h('br', { key: `br-${pIdx}` }));
            paraChildren.push(renderInlineMarkdown(pLine, `p-${blocks.length}-${pIdx}`));
          });
          blocks.push(
            h('p', {
              key: `md-p-${blocks.length}`,
              style: {
                margin: 0,
                fontSize: '1.02rem',
                lineHeight: 1.75,
                color: '#231926'
              }
            }, ...paraChildren)
          );
        }
      }

      return h('div', {
        style: {
          display: 'flex',
          flexDirection: 'column',
          gap: '1.1rem'
        }
      }, ...blocks);
    }

      return h('span', {

        }

        'PENDING'
      );
    }

        }, current === STATUS.PENDING ? '● Pending' : 'Pending'),

            boxShadow: current === STATUS.INDEPENDENT ? '2px 2px 0px rgba(81, 43, 88, 0.25)' : 'none',

    function App() {
      const [mainSection, setMainSection] = useState('logs');
      const [roadmapSubTab, setRoadmapSubTab] = useState('dashboard');
      const [bioOpen, setBioOpen] = useState(false);

      // Canonical Read-Only State (Loaded from ./state.json committed via Git CLI)
      const [bio, setBio] = useState(DEFAULT_BIO);
      const [posts, setPosts] = useState(INITIAL_LOGS);
      const [tasks, setTasks] = useState({});
      const [gates, setGates] = useState({});
      const [opTasks, setOpTasks] = useState({});
      const [opGates, setOpGates] = useState({});
      const [deliverables, setDeliverables] = useState({});
      const [assessments, setAssessments] = useState(() => {
        const defaults = {};
        ['terraform', 'docker', 'cicd', 'scripting', 'linux'].forEach(skill => {
          defaults[`${skill}_t0`] = STATUS.INDEPENDENT;
          defaults[`${skill}_t1`] = STATUS.AI_ASSISTED;
        });
        return defaults;
      });
      const [branch, setBranch] = useState(null);
      const [portfolio, setPortfolio] = useState({});
      const [applications, setApplications] = useState(() => {
        const defaults = {};
        COHORTS.forEach(c => { defaults[c.id] = { applied: 0, screens: 0, tech: 0 }; });
        return defaults;
      });

      // Live GitHub & Gitea Data
      const [githubCommits, setGithubCommits] = useState([]);
      const [giteaCommits, setGiteaCommits] = useState([]);
      const [githubRepos, setGithubRepos] = useState([]);
      const [gitSyncStatus, setGitSyncStatus] = useState('');
      const [repoLogsStatus, setRepoLogsStatus] = useState('');

      // GitOps Auto-Update Telemetry State
      const [gitOpsSync, setGitOpsSync] = useState({
        status: 'idle', // 'idle' | 'syncing' | 'synced' | 'fallback'
        source: 'local', // 'github' | 'local'
        repo: 'xarop-pa-toss/layer-zero',
        branch: 'main',
        lastCommitSha: '',
        lastCommitMsg: '',
        lastCommitDate: '',
        lastSyncedAt: '',
        logCount: 0
      });

      // Read-Only Logs Filter & Reader State
      const [selectedTag, setSelectedTag] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [readingPost, setReadingPost] = useState(null);

      // Keebs State (Hardware articles & Layer preview)
      const [readingKeebArticle, setReadingKeebArticle] = useState(null);
      const [keebLayer, setKeebLayer] = useState(0);

      // Helper to apply canonical state values to React state
      function applyCanonicalState(data) {
        if (!data || typeof data !== 'object') return;
        if (data.bio) setBio(prev => ({ ...prev, ...data.bio }));
        if (data.tasks) setTasks(data.tasks);
        if (data.gates) setGates(data.gates);
        if (data.opTasks) setOpTasks(data.opTasks);
        if (data.opGates) setOpGates(data.opGates);
        if (data.deliverables) setDeliverables(data.deliverables);
        if (data.assessments) setAssessments(data.assessments);
        if (data.branch !== undefined) setBranch(data.branch);
        if (data.portfolio) setPortfolio(data.portfolio);
        if (data.applications) setApplications(data.applications);
      }

      // 1. Load canonical state.json: tries GitHub Raw CDN first (instant GitOps), then local ./state.json
      async function loadCanonicalStateJson(targetRepo) {
        const repoSlug = (targetRepo || bio.logsRepo || 'xarop-pa-toss/layer-zero').trim();
        const cacheBuster = Date.now();
        let syncSource = 'local';
        let loaded = false;

        // Primary: GitHub Raw CDN (direct from main branch)
        if (repoSlug && repoSlug.includes('/')) {
          const rawEndpoints = [
            `https://raw.githubusercontent.com/${repoSlug}/main/public/state.json?t=${cacheBuster}`,
            `https://raw.githubusercontent.com/${repoSlug}/main/state.json?t=${cacheBuster}`
          ];
          for (const url of rawEndpoints) {
            try {
              const res = await fetch(url, { cache: 'no-store' });
              if (res.ok) {
                const data = await res.json();
                if (data && (data.bio || data.tasks || data.opTasks)) {
                  applyCanonicalState(data);
                  syncSource = 'github';
                  loaded = true;
                  break;
                }
              }
            } catch (e) {}
          }
        }

        // Fallback: bundled local ./state.json
        if (!loaded) {
          try {
            const res = await fetch(`./state.json?t=${cacheBuster}`, { cache: 'no-store' });
            if (res.ok) {
              const data = await res.json();
              applyCanonicalState(data);
              syncSource = 'local';
              loaded = true;
            }
          } catch (e) {}
        }

        return syncSource;
      }

      // 2. Fetch latest commit on main branch for live GitOps status indicator
      async function fetchLatestRepoCommit(targetRepo) {
        const repoSlug = (targetRepo || bio.logsRepo || 'xarop-pa-toss/layer-zero').trim();
        if (!repoSlug || !repoSlug.includes('/')) return null;
        try {
          const res = await fetch(`https://api.github.com/repos/${repoSlug}/commits?per_page=1`, {
            headers: { 'Accept': 'application/vnd.github.v3+json' },
            cache: 'no-store'
          });
          if (res.ok) {
            const cList = await res.json();
            if (Array.isArray(cList) && cList.length > 0) {
              const c = cList[0];
              return {
                sha: c.sha ? c.sha.slice(0, 7) : '',
                fullSha: c.sha || '',
                message: c.commit && c.commit.message ? c.commit.message.split('\n')[0] : 'commit',
                date: c.commit && c.commit.author && c.commit.author.date ? c.commit.author.date.split('T')[0] : ''
              };
            }
          }
        } catch (e) {}
        return null;
      }

      // 3. Load real Markdown logs from GitHub Contents API + local bundled logs
      async function loadLogsFromGit(targetRepo, targetFolder) {
        const repoSlug = (targetRepo || bio.logsRepo || 'xarop-pa-toss/layer-zero').trim();
        const folderPath = (targetFolder || bio.logsPath || 'logs').trim().replace(/^\/+|\/+$/g, '');
        const loadedPosts = [];
        const seenNames = new Set();
        const cacheBuster = Date.now();

        // Step A: Load local repo Markdown files listed in ./logs/index.json
        try {
          const idxRes = await fetch(`./logs/index.json?t=${cacheBuster}`, { cache: 'no-store' });
          if (idxRes.ok) {
            const fileList = await idxRes.json();
            if (Array.isArray(fileList)) {
              for (const fileName of fileList) {
                try {
                  const mdRes = await fetch(`./logs/${fileName}?t=${cacheBuster}`, { cache: 'no-store' });
                  if (mdRes.ok) {
                    const rawText = await mdRes.text();
                    const parsed = parseMarkdownWithFrontmatter(rawText, fileName);
                    seenNames.add(fileName);
                    loadedPosts.push({
                      id: `local-md-${fileName}`,
                      title: parsed.title,
                      date: parsed.date,
                      tags: parsed.tags,
                      source: `logs/${fileName}`,
                      summary: parsed.summary,
                      content: parsed.content
                    });
                  }
                } catch (e) {}
              }
            }
          }
        } catch (e) {}

        // Step B: Check GitHub Contents API for markdown files in public/logs and logs
        if (repoSlug && repoSlug.includes('/')) {
          const candidatePaths = [
            `public/${folderPath}`,
            folderPath
          ];
          for (const cPath of candidatePaths) {
            try {
              const url = `https://api.github.com/repos/${repoSlug}/contents/${cPath}?ref=main`;
              const res = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github.v3+json' },
                cache: 'no-store'
              });
              if (res.ok) {
                const items = await res.json();
                if (Array.isArray(items)) {
                  const mdFiles = items.filter(f => f.type === 'file' && /\.(md|markdown|txt)$/i.test(f.name));
                  for (const fileItem of mdFiles.slice(0, 30)) {
                    if (!seenNames.has(fileItem.name)) {
                      // Fetch raw content with cache-buster
                      const rawUrl = fileItem.download_url || `https://raw.githubusercontent.com/${repoSlug}/main/${fileItem.path}`;
                      const rawRes = await fetch(`${rawUrl}${rawUrl.includes('?') ? '&' : '?'}t=${cacheBuster}`);
                      if (rawRes.ok) {
                        const rawText = await rawRes.text();
                        const parsed = parseMarkdownWithFrontmatter(rawText, fileItem.name);
                        seenNames.add(fileItem.name);
                        loadedPosts.push({
                          id: 'gh-md-' + fileItem.sha,
                          title: parsed.title,
                          date: parsed.date,
                          tags: parsed.tags,
                          source: `${repoSlug}/${fileItem.path}`,
                          summary: parsed.summary,
                          content: parsed.content
                        });
                      }
                    }
                  }
                }
              }
            } catch (e) {}
          }
        }

        if (loadedPosts.length > 0) {
          loadedPosts.sort((a, b) => String(b.date).localeCompare(String(a.date)));
          setPosts(loadedPosts);
          setRepoLogsStatus(`Synced ${loadedPosts.length} Markdown log(s) from Git.`);
        }
        return loadedPosts.length;
      }

      // 4. Fetch real GitHub activity & repositories for xarop-pa-toss
      async function fetchLiveGitActivity() {
        const user = (bio.githubUser || 'xarop-pa-toss').trim();
        try {
          const [eventsRes, reposRes] = await Promise.all([
            fetch(`https://api.github.com/users/${encodeURIComponent(user)}/events/public?per_page=30`),
            fetch(`https://api.github.com/users/${encodeURIComponent(user)}/repos?sort=updated&per_page=12`)
          ]);

          if (reposRes.ok) {
            const reposData = await reposRes.json();
            if (Array.isArray(reposData)) {
              setGithubRepos(reposData);
              const repoCommits = [];
              for (const r of reposData.slice(0, 2)) {
                try {
                  const cRes = await fetch(`https://api.github.com/repos/${r.full_name}/commits?per_page=2`);
                  if (cRes.ok) {
                    const cList = await cRes.json();
                    if (Array.isArray(cList)) {
                      cList.forEach(item => {
                        repoCommits.push({
                          id: item.sha,
                          source: 'GitHub',
                          repo: r.full_name,
                          branch: r.default_branch || 'main',
                          hash: String(item.sha || '').slice(0, 7),
                          message: item.commit && item.commit.message ? item.commit.message.split('\n')[0] : 'commit',
                          date: item.commit && item.commit.author && item.commit.author.date ? item.commit.author.date.split('T')[0] : ''
                        });
                      });
                    }
                  }
                } catch (e) {}
              }
              if (repoCommits.length > 0) {
                setGithubCommits(repoCommits);
              }
            }
          }

          if (eventsRes.ok) {
            const eventsData = await eventsRes.json();
            const extractedCommits = [];
            if (Array.isArray(eventsData)) {
              eventsData.forEach(ev => {
                if (ev.type === 'PushEvent' && ev.payload && Array.isArray(ev.payload.commits)) {
                  const branchName = String(ev.payload.ref || 'refs/heads/main').replace('refs/heads/', '');
                  ev.payload.commits.slice().reverse().forEach(c => {
                    extractedCommits.push({
                      id: c.sha,
                      source: 'GitHub',
                      repo: ev.repo ? ev.repo.name : user,
                      branch: branchName,
                      hash: String(c.sha || '').slice(0, 7),
                      message: String(c.message || '').split('\n')[0],
                      date: ev.created_at ? ev.created_at.split('T')[0] : ''
                    });
                  });
                }
              });
            }
            if (extractedCommits.length > 0) {
              setGithubCommits(extractedCommits.slice(0, 8));
            }
          }
        } catch (err) {}

        if (bio.giteaBaseUrl && bio.giteaBaseUrl.trim()) {
          try {
            const base = bio.giteaBaseUrl.trim().replace(/\/+$/, '');
            const gUser = (bio.giteaUser || 'xarop_pa_toss').trim();
            const res = await fetch(`${base}/api/v1/users/${encodeURIComponent(gUser)}/repos?limit=5`);
            if (res.ok) {
              const gRepos = await res.json();
              if (Array.isArray(gRepos) && gRepos.length > 0) {
                const topRepo = gRepos[0];
                const cRes = await fetch(`${base}/api/v1/repos/${topRepo.full_name}/commits?limit=3`);
                if (cRes.ok) {
                  const cData = await cRes.json();
                  if (Array.isArray(cData)) {
                    setGiteaCommits(cData.map(item => ({
                      id: item.sha,
                      source: 'Gitea',
                      repo: topRepo.full_name,
                      branch: topRepo.default_branch || 'main',
                      hash: String(item.sha || '').slice(0, 7),
                      message: item.commit && item.commit.message ? item.commit.message.split('\n')[0] : 'commit',
                      date: item.created ? item.created.split('T')[0] : ''
                    })));
                  }
                }
              }
            }
          } catch (e) {}
        }
      }

      // Master GitOps Sync Pipeline
      async function triggerGitOpsSync(isInitial = false) {
        setGitOpsSync(prev => ({ ...prev, status: 'syncing' }));
        setGitSyncStatus('Synchronizing live state and logs from GitHub...');

        const repoSlug = (bio.logsRepo || 'xarop-pa-toss/layer-zero').trim();

        // Run sync operations in parallel
        const [syncSource, commitInfo, logCount] = await Promise.all([
          loadCanonicalStateJson(repoSlug),
          fetchLatestRepoCommit(repoSlug),
          loadLogsFromGit(repoSlug, bio.logsPath || 'logs'),
          fetchLiveGitActivity()
        ]);

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        setGitOpsSync({
          status: syncSource === 'github' ? 'synced' : 'fallback',
          source: syncSource,
          repo: repoSlug,
          branch: 'main',
          lastCommitSha: commitInfo ? commitInfo.sha : '',
          lastCommitMsg: commitInfo ? commitInfo.message : '',
          lastCommitDate: commitInfo ? commitInfo.date : '',
          lastSyncedAt: timeStr,
          logCount: logCount || 0
        });

        if (syncSource === 'github') {
          setGitSyncStatus(`GitOps live: synced from github.com/${repoSlug}@${commitInfo ? commitInfo.sha : 'main'} at ${timeStr}.`);
        } else {
          setGitSyncStatus(`Synced at ${timeStr} (using bundled repo state; head commit ${commitInfo ? commitInfo.sha : 'local'}).`);
        }
      }

      useEffect(() => {
        triggerGitOpsSync(true);
      }, []);

      const downloadPostAsMarkdown = (post) => {
        const md = buildMarkdownFileContent(post);
        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const slug = post.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'log';
        const a = document.createElement('a');
        a.href = url;
        a.download = `${post.date}-${slug}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      // Computed Roadmap & Operation Flaggo Progress
      const progressStats = useMemo(() => {
        let totalTasks = 0;
        let independentTasks = 0;
        let aiTasks = 0;
        ROADMAP_DATA.forEach(w => {
          w.tasks.forEach(t => {
            totalTasks++;
            if (tasks[t.id] === STATUS.INDEPENDENT) independentTasks++;
            if (tasks[t.id] === STATUS.AI_ASSISTED) aiTasks++;
          });
        });
        const totalGates = ROADMAP_DATA.length;
        const passedGates = ROADMAP_DATA.filter(w => gates[w.gate.id] === STATUS.INDEPENDENT).length;

        let opTotal = 0;
        let opInd = 0;
        FLAGGO_MILESTONES.forEach(m => {
          m.tasks.forEach(t => {
            opTotal++;
            if (opTasks[t.id] === STATUS.INDEPENDENT) opInd++;
          });
        });
        const opPassedGates = FLAGGO_MILESTONES.filter(m => opGates[m.gateId] === STATUS.INDEPENDENT).length;

        return {
          totalTasks,
          independentTasks,
          aiTasks,
          completionPercent: Math.round((independentTasks / totalTasks) * 100) || 0,
          totalGates,
          passedGates,
          opTotal,
          opInd,
          opPercent: Math.round((opInd / opTotal) * 100) || 0,
          opPassedGates,
          opTotalGates: FLAGGO_MILESTONES.length
        };
      }, [tasks, gates, opTasks, opGates]);

      const allTags = useMemo(() => {
        const s = new Set();
        posts.forEach(p => (p.tags || []).forEach(t => s.add(t.toLowerCase())));
        return Array.from(s).sort();
      }, [posts]);

      const filteredPosts = useMemo(() => {
        return posts.filter(p => {
          const tagMatch = selectedTag === 'all' || (p.tags || []).some(t => t.toLowerCase() === selectedTag);
          if (!tagMatch) return false;
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          return (
            p.title.toLowerCase().includes(q) ||
            p.summary.toLowerCase().includes(q) ||
            p.content.toLowerCase().includes(q) ||
            (p.tags || []).some(t => t.toLowerCase().includes(q))
          );
        });
      }, [posts, selectedTag, searchQuery]);

      // --- SECTION 1: HOME PAGE ("THE LOGS" + WORKSTATION WELCOME — STRICTLY READ-ONLY) ---
      const renderHomeLogs = () => h('div', { style: { display: 'flex', flexDirection: 'column', gap: '2.75rem' } },
        // Spacious OS Window Hero
        h('section', { className: 'os-window' },
          h('div', { className: 'os-titlebar' },
            h('span', null, `Layer Zero — ${bio.name}`),
            h('span', null, `@${bio.handle}`)
          ),
          h('div', { style: { padding: '2.25rem', display: 'flex', flexDirection: 'column', gap: '1.5rem' } },
            h('div', { style: { maxWidth: '72ch', display: 'flex', flexDirection: 'column', gap: '0.85rem' } },
              h('h1', {
                className: 'font-display',
                style: { fontSize: 'clamp(1.85rem, 3.2vw, 2.6rem)', fontWeight: 700, color: '#512B58', lineHeight: 1.18 }
              }, 'Ricardo Giro — Infrastructure, DevOps & Engineering Hub'),
              h('p', { style: { fontSize: '1.02rem', color: '#231926' } }, bio.summary),
              h('p', { style: { fontSize: '0.95rem', color: '#4E5D63' } },
                'Active Roadmap Project: ',
                h('strong', { style: { color: '#512B58' } }, 'Flaggo'),
                ' — a lightweight, self-hosted 4-app Feature Flag & Runtime Configuration Platform decoupling code deployment from feature release.'
              )
            ),
            h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '0.85rem', paddingTop: '1.25rem', borderTop: '1px solid rgba(42, 120, 134, 0.3)' } },
              h('button', {
                type: 'button',
                onClick: () => setMainSection('operation'),
                className: 'os-btn os-btn-primary'
              }, `Operation Flaggo (${progressStats.opPassedGates}/${progressStats.opTotalGates} Gates)`),
              h('button', {
                type: 'button',
                onClick: () => setMainSection('roadmap'),
                className: 'os-btn os-btn-teal'
              }, `DevOps Roadmap (${progressStats.completionPercent}%)`),
              h('button', {
                type: 'button',
                onClick: () => setMainSection('keebs'),
                className: 'os-btn os-btn-teal'
              }, 'Keebs (Lily58 & Lotus58)'),
              h('button', {
                type: 'button',
                onClick: () => setMainSection('projects'),
                className: 'os-btn'
              }, 'Other Stuff'),
              h('a', {
                href: bio.githubUrl,
                target: '_blank',
                rel: 'noreferrer',
                className: 'os-btn'
              }, 'GitHub ->')
            )
          )
        ),

        // THE LOGS SECTION (READ-ONLY FROM GIT)
        h('section', { style: { display: 'flex', flexDirection: 'column', gap: '1.5rem' } },

                      h('div', null,
                        h('div', { className: 'font-mono', style: { fontSize: '13px', fontWeight: 600, color: '#512B58' } }, repo.full_name),
                        h('p', { style: { fontSize: '0.88rem', color: '#231926', marginTop: '0.35rem' } }, repo.description || 'Public repository on GitHub.')
                      ),
                      h('div', { className: 'font-mono', style: { fontSize: '11.5px', color: '#2A7886' } },
                        `${repo.language || 'Repo'} · Updated ${String(repo.updated_at || '').split('T')[0]} ↗`
                      )
                    )
                  )
                )
          )
        )
      );

      // Build bottom commit stream strictly from real live state (no fake commits)
      const tickerItems = useMemo(() => {
        const items = [];
        if (githubCommits.length > 0) {
          githubCommits.forEach(c => {
            items.push(`[GITHUB] ${c.repo}@${c.branch} (${c.hash}) — ${c.message} (${c.date})`);
          });
        } else {
          items.push(`[GITHUB] github.com/${bio.githubUser} — ${gitSyncStatus || 'Polling public events API...'}`);
        }

        if (giteaCommits.length > 0) {
          giteaCommits.forEach(c => {
            items.push(`[GITEA] ${c.repo}@${c.branch} (${c.hash}) — ${c.message} (${c.date})`);
          });
        } else if (bio.giteaBaseUrl && bio.giteaBaseUrl.trim()) {
          items.push(`[GITEA] ${bio.giteaBaseUrl} (@${bio.giteaUser}) — Polling Gitea commits`);
        }
        return items;
      }, [githubCommits, giteaCommits, bio.githubUser, bio.giteaBaseUrl, bio.giteaUser, gitSyncStatus]);

      return h('div', { style: { minHeight: '100vh', display: 'flex', flexDirection: 'column' } },
        // --- 3-ZONE TOP BAR: "Layer Zero" | 5 Nav Links | Bio Button ---
        h('header', { className: 'top-bar' },
          h('button', {
            type: 'button',
            onClick: () => setMainSection('logs'),
            className: 'font-display',
            style: { fontSize: '1.35rem', fontWeight: 700, color: '#512B58', whiteSpace: 'nowrap', flexShrink: 0 }
          }, 'Layer Zero'),

          h('nav', { className: 'nav-links', ariaLabel: 'Main Navigation' },
            ...[
              { id: 'logs', label: 'The Logs' },
              { id: 'roadmap', label: 'DevOps Roadmap' },
              { id: 'operation', label: 'Operation Flaggo' },
              { id: 'keebs', label: 'Keebs' },
              { id: 'projects', label: 'Other Stuff' }
            ].map(item =>
              h('button', {
                key: item.id,
                type: 'button',
                onClick: () => setMainSection(item.id),
                className: `nav-link ${mainSection === item.id ? 'nav-link-active' : ''}`
              }, item.label)
            )
          ),

          h('div', { style: { display: 'flex', alignItems: 'center', gap: '0.65rem', flexShrink: 0 } },
            h('button', {
              type: 'button',
              onClick: () => triggerGitOpsSync(false),
              title: `GitOps Sync: Pull newest state & logs from ${gitOpsSync.repo}@${gitOpsSync.branch}`,
              className: 'os-btn',
              style: {
                fontSize: '11px',
                padding: '0.4rem 0.65rem',
                backgroundColor: gitOpsSync.status === 'syncing' ? '#E6ECEE' : (gitOpsSync.source === 'github' ? '#79BAC1' : '#F1F3F4'),
                color: '#512B58',
                borderColor: '#2A7886',
                display: 'inline-flex',
                alignItems: 'center',
                gap: '0.4rem'
              }
            },
              h('span', {
                style: {
                  display: 'inline-block',
                  width: '7px',
                  height: '7px',
                  borderRadius: '50%',
                  backgroundColor: gitOpsSync.status === 'syncing' ? '#FFA500' : (gitOpsSync.source === 'github' ? '#2A7886' : '#512B58')
                }
              }),
              gitOpsSync.status === 'syncing'
                ? 'SYNCING...'
                : (gitOpsSync.lastCommitSha ? `GITOPS: @${gitOpsSync.lastCommitSha} ↻` : 'GITOPS SYNC ↻')
            ),
            h('button', {
              type: 'button',
              onClick: () => setBioOpen(true),
              className: 'os-btn os-btn-primary'
            }, 'Bio — Ricardo Giro')
          )
        ),

        // --- MAIN WORKSPACE ---
        h('main', { className: 'shell-container', style: { flex: 1, width: '100%' } },
          mainSection === 'logs' ? renderHomeLogs() :
          mainSection === 'roadmap' ? renderRoadmapSection() :
          mainSection === 'operation' ? renderOperationFlaggo() :
          mainSection === 'keebs' ? renderKeebsSection() :
          renderProjectsAndRepos()
        ),

        // --- BIO MODAL (READ-ONLY, OPENABLE FROM ANYWHERE VIA TOP BAR) ---
        bioOpen ? h('div', { className: 'modal-backdrop', role: 'dialog', ariaModal: 'true', ariaLabel: 'Bio — Ricardo Giro' },
          h('div', { className: 'os-window', style: { width: '100%', maxWidth: '640px' } },
            h('div', { className: 'os-titlebar' },
              h('span', null, `Bio — ${bio.name} (@${bio.handle})`),
              h('button', { type: 'button', onClick: () => setBioOpen(false), style: { color: '#FFFFFF', fontWeight: 700 } }, '[X]')
            ),
            h('div', { style: { padding: '1.75rem', display: 'flex', flexDirection: 'column', gap: '1.25rem' } },
              h('div', { style: { display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'center', gap: '1rem', borderBottom: '1px solid rgba(42, 120, 134, 0.35)', paddingBottom: '1rem' } },
                h('div', null,
                  h('div', { className: 'font-mono', style: { fontSize: '12px', color: '#2A7886', fontWeight: 600 } }, `@${bio.handle}`),
                  h('div', { className: 'font-display', style: { fontSize: '1.5rem', fontWeight: 700, color: '#512B58' } }, bio.name),
                  h('div', { style: { fontSize: '0.9rem', color: '#4E5D63' } }, bio.role)
                ),
                h('div', { style: { display: 'flex', gap: '0.6rem' } },
                  h('a', { href: bio.githubUrl, target: '_blank', rel: 'noreferrer', className: 'os-btn os-btn-primary' }, 'GitHub (xarop-pa-toss) ↗'),
                  bio.giteaBaseUrl ? h('a', { href: bio.giteaBaseUrl, target: '_blank', rel: 'noreferrer', className: 'os-btn' }, 'Self-Hosted Gitea ↗') : null
                )
              ),
              h('p', { style: { fontSize: '0.95rem', color: '#231926' } }, bio.summary),
              h('div', { className: 'os-panel', style: { padding: '1rem' } },
                h('div', { className: 'font-mono', style: { fontSize: '11.5px', color: '#512B58', fontWeight: 600 } }, 'ROADMAP PROJECT: FLAGGO'),
                h('p', { style: { fontSize: '0.9rem', color: '#231926', marginTop: '0.25rem' } }, bio.pitch)
              ),
              h('div', null,
                h('div', { className: 'font-mono', style: { fontSize: '11.5px', color: '#4E5D63', marginBottom: '0.25rem' } }, 'CORE STACK'),
                h('div', { className: 'font-mono', style: { fontSize: '12.5px', color: '#512B58' } }, bio.stack)
              )
            )
          )
        ) : null,

        // --- KEEBS ARTICLE READER MODAL ---
        readingKeebArticle ? h('div', { className: 'modal-backdrop', role: 'dialog', ariaModal: 'true', ariaLabel: readingKeebArticle.title },
          h('div', { className: 'os-window', style: { width: '100%', maxWidth: '780px', maxHeight: '88vh', display: 'flex', flexDirection: 'column' } },
            h('div', { className: 'os-titlebar os-titlebar-teal' },
              h('span', null, `${readingKeebArticle.name} — Hardware Article & Build Log`),
              h('button', { type: 'button', onClick: () => setReadingKeebArticle(null), style: { color: '#FFFFFF', fontWeight: 700 } }, '[X]')
            ),
            h('div', { style: { padding: '2rem', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '1.5rem' } },
              h('div', null,
                h('div', { className: 'font-mono', style: { fontSize: '12px', color: '#2A7886', marginBottom: '0.35rem' } },
                  `${readingKeebArticle.date} · ${readingKeebArticle.readTime} · ${(readingKeebArticle.tags || []).map(t => '#' + t).join(' ')}`
                ),
                h('h2', { className: 'font-display', style: { fontSize: '1.75rem', fontWeight: 700, color: '#512B58' } }, readingKeebArticle.title),
                h('p', { style: { fontSize: '1rem', color: '#231926', marginTop: '0.5rem' } }, readingKeebArticle.subtitle)
              ),

              // Embedded interactive schematic
              h('div', { style: { border: '1px solid #2A7886' } },
                readingKeebArticle.id === 'lily58' ? h(Lily58Svg, { layer: keebLayer }) : h(Lotus58Svg, { layer: keebLayer })
              ),

              // Specs grid
              h('div', { className: 'grid-2', style: { gap: '0.75rem' } },
                ...readingKeebArticle.specs.map(s =>
                  h('div', { key: s.label, className: 'os-panel', style: { padding: '0.65rem 0.85rem' } },
                    h('div', { className: 'font-mono', style: { fontSize: '11px', color: '#4E5D63' } }, s.label),
                    h('div', { className: 'font-mono', style: { fontSize: '12px', color: '#512B58', fontWeight: 600, marginTop: '2px' } }, s.val)
                  )
                )
              ),

              // Content sections
              ...readingKeebArticle.sections.map(sec =>
                h('section', { key: sec.heading, style: { display: 'flex', flexDirection: 'column', gap: '0.45rem' } },
                  h('h3', { className: 'font-display', style: { fontSize: '1.25rem', fontWeight: 700, color: '#512B58' } }, sec.heading),
                  h('p', { style: { fontSize: '0.96rem', lineHeight: 1.7, color: '#231926' } }, sec.text)
                )
              ),

              h('div', { style: { display: 'flex', justifyContent: 'flex-end', paddingTop: '1.25rem', borderTop: '1px solid rgba(42, 120, 134, 0.3)' } },
                h('button', { type: 'button', onClick: () => setReadingKeebArticle(null), className: 'os-btn os-btn-primary' }, 'Close Article')
              )
            )
          )
        ) : null,

        // --- LOG READER MODAL ---
        readingPost ? h('div', {
          className: 'modal-backdrop',
          role: 'dialog',
          ariaModal: 'true',
          ariaLabel: readingPost.title,
          onClick: (e) => { if (e.target === e.currentTarget) setReadingPost(null); }
        },
          h('div', {
            className: 'os-window',
            style: { width: '95vw', maxWidth: '1040px', maxHeight: '88vh', display: 'flex', flexDirection: 'column' }
          },
            h('div', { className: 'os-titlebar os-titlebar-teal' },
              h('span', null, `${readingPost.date} · ${(readingPost.tags || []).map(t => '#' + t).join(' / ')}`),
              h('button', { type: 'button', onClick: () => setReadingPost(null), style: { color: '#FFFFFF', fontWeight: 700 } }, '[X]')
            ),
            h('div', { style: { padding: '2.25rem 2.5rem', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '1.35rem' } },
              h('div', { style: { paddingBottom: '0.85rem', borderBottom: '2px solid #512B58' } },
                h('h2', { className: 'font-display', style: { fontSize: '1.85rem', fontWeight: 700, color: '#512B58', lineHeight: 1.2 } }, readingPost.title),
                readingPost.source ? h('div', { className: 'font-mono', style: { fontSize: '11.5px', color: '#4E5D63', marginTop: '0.35rem' } }, `Source: ${readingPost.source}`) : null
              ),
              h(MarkdownRenderer, { content: readingPost.content }),
              h('div', { style: { display: 'flex', justifyContent: 'space-between', paddingTop: '1.25rem', marginTop: '0.5rem', borderTop: '1px solid rgba(42, 120, 134, 0.3)' } },
                h('button', { type: 'button', onClick: () => downloadPostAsMarkdown(readingPost), className: 'os-btn' }, 'Download .md File'),
                h('button', { type: 'button', onClick: () => setReadingPost(null), className: 'os-btn os-btn-primary' }, 'Close')
              )
            )
          )
        ) : null,

        // --- PERSISTENT BOTTOM SCROLLING BAR (REAL GITHUB + GITEA STREAM) ---
        h('footer', { className: 'commit-ticker-bar', ariaLabel: 'Latest GitHub and Gitea Commits' },
          h('div', { className: 'commit-ticker-label' }, 'GIT STREAM'),
          h('div', { className: 'commit-ticker-viewport' },
            h('div', { className: 'commit-ticker-track' },
              ...[...tickerItems, ...tickerItems].map((text, idx) =>
                h('span', {
                  key: idx,
                  style: { display: 'inline-flex', alignItems: 'center', padding: '0 2.25rem', whiteSpace: 'nowrap' }
                }, text)
              )
            )
          ),
          h('div', { style: { display: 'flex', height: '100%', flexShrink: 0 } },
            h('button', {
              type: 'button',
              onClick: () => triggerGitOpsSync(false),
              style: {
                height: '100%',
                padding: '0 0.65rem',
                fontSize: '0.66rem',
                backgroundColor: '#2A7886',
                color: '#FFFFFF',
                borderLeft: '1.5px solid #512B58',
                display: 'inline-flex',
                alignItems: 'center',
                gap: '0.35rem',
                cursor: 'pointer'
              },
              title: `Click to pull newest commits and state from github.com/${gitOpsSync.repo}`
            },
              h('span', {
                style: {
                  display: 'inline-block',
                  width: '6px',
                  height: '6px',
                  borderRadius: '50%',
                  backgroundColor: gitOpsSync.status === 'syncing' ? '#FFA500' : '#79BAC1'
                }
              }),
              gitOpsSync.lastCommitSha ? `GITOPS: @${gitOpsSync.lastCommitSha}` : 'GITOPS: LIVE'
            ),
            h('a', {
              href: bio.githubUrl,
              target: '_blank',
              rel: 'noreferrer',
              style: {
                height: '100%',
                padding: '0 0.7rem',
                fontSize: '0.66rem',
                backgroundColor: '#79BAC1',
                color: '#512B58',
                fontWeight: 600,
                borderLeft: '1.5px solid #512B58',
                display: 'inline-flex',
                alignItems: 'center',
                whiteSpace: 'nowrap'
              }
            }, '@xarop-pa-toss ↗')
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
